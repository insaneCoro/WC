<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>WC '26 Prediction League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       WC '26 PREDICTION LEAGUE — STADIUM SCOREBOARD THEME
       Palette: Pitch green · Trophy gold · Match card white
       Type: Barlow Condensed (scores/headings) + Barlow (body)
    ═══════════════════════════════════════════════════════ */
    :root {
      /* Surfaces */
      --bg:       #0B1F12;   /* deep pitch green */
      --bg2:      #0E2616;   /* slightly lighter pitch */
      --panel:    #122B19;   /* card background */
      --panel2:   #163220;   /* elevated card */
      --glass:    rgba(18,43,25,.88);

      /* Type */
      --text:     #F0EDE6;   /* warm white */
      --muted:    #7A9E82;   /* sage green */
      --dim:      #4A7255;   /* very muted */

      /* Accent — trophy gold */
      --gold:     #D4A520;
      --gold2:    #F0C842;
      --gold-glow:rgba(212,165,32,.20);
      --gold-line:rgba(212,165,32,.30);

      /* Semantic */
      --good:     #52C97A;   /* correct pick */
      --warn:     #E8A020;   /* locked / warning */
      --bad:      #E85050;   /* wrong */
      --done:     #4AB8C8;   /* completed match */

      /* Lines & shadows */
      --line:     rgba(255,255,255,.09);
      --line2:    rgba(255,255,255,.05);
      --shadow:   0 8px 32px rgba(0,0,0,.45);
      --shadow-sm:0 2px 8px rgba(0,0,0,.30);

      /* Radii */
      --r:        16px;
      --r2:       10px;
      --r-pill:   999px;

      /* Focus */
      --focus:    0 0 0 3px rgba(212,165,32,.35);

      /* Fonts */
      --font-display: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif;
      --font-body:    'Barlow', ui-sans-serif, system-ui, sans-serif;
      --font-score:   'Barlow Condensed', monospace;
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh;
      font-family: var(--font-body);
      font-size: 15px; line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, var(--gold-glow) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 0% 50%, rgba(0,0,0,.22) 0%, transparent 50%);
      background-attachment: fixed;
    }
    body[dir=rtl] {
      font-family: 'Noto Sans Arabic', 'Barlow', ui-sans-serif, system-ui, sans-serif;
    }
    h1,h2,h3,h4 {
      font-family: var(--font-display);
      font-weight: 700; letter-spacing: .01em;
      margin: 0;
    }
    .hidden  { display: none !important; }
    .muted   { color: var(--muted); }
    .tiny    { font-size: 12px; color: var(--muted); }
    .dim     { color: var(--dim); }

    /* ── Layout shell ── */
    .appShell { max-width: 1280px; margin: auto; padding: 0 16px 48px; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: var(--bg);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--line);
    }
    .topInner {
      max-width: 1280px; margin: auto;
      padding: 12px 16px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; font-size: 22px; font-weight: 900;
      box-shadow: 0 0 0 1px var(--gold-line), 0 6px 20px var(--gold-glow);
    }
    h1 { font-size: 20px; line-height: 1.1; letter-spacing: .02em; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-body); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Tab nav ── */
    .nav {
      position: sticky; top: 69px; z-index: 55;
      padding: 10px 0 6px;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
    }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: var(--r-pill);
      font-family: var(--font-display);
      font-weight: 600; font-size: 14px; letter-spacing: .03em;
      cursor: pointer; transition: all .14s;
    }
    .tab:hover { color: var(--text); border-color: var(--gold-line); }
    .tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; border-color: transparent; font-weight: 900;
      box-shadow: 0 2px 12px var(--gold-glow);
    }
    .tab:focus-visible { box-shadow: var(--focus); outline: none; }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card.soft {
      background: var(--bg2);
      box-shadow: none;
      border-color: var(--line2);
    }

    /* ── Layout helpers ── */
    .hero   { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; margin: 14px 0; }
    .grid   { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .row    { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .section{ margin-top: 14px; }
    .wide   { width: 100%; }

    /* ── Buttons, inputs, selects ── */
    button, input, select {
      border-radius: var(--r2);
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--text);
      padding: 10px 13px;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    input:focus, select:focus, button:focus-visible {
      box-shadow: var(--focus);
      border-color: var(--gold-line);
    }
    button {
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 700; font-size: 14px; letter-spacing: .03em;
      transition: all .14s; min-height: 40px;
    }
    button:hover  { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12;
      box-shadow: 0 2px 10px var(--gold-glow);
    }
    button.primary:hover { box-shadow: 0 4px 18px var(--gold-glow); }
    .ghost  { background: rgba(255,255,255,.04); }
    .danger { border-color: rgba(232,80,80,.5); color: #ffcaca; }
    label   { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-family: var(--font-body); }

    /* ── Pills & badges ── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line);
      background: var(--bg2);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      color: var(--muted); font-size: 12px;
      font-family: var(--font-body);
    }
    .saveBadge {
      font-size: 12px; padding: 5px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      background: var(--bg2);
      font-family: var(--font-body);
    }
    .saveBadge.good { color: var(--good); border-color: rgba(82,201,122,.30); }
    .saveBadge.warn { color: var(--warn); border-color: rgba(232,160,32,.30); }
    .saveBadge.bad  { color: var(--bad);  border-color: rgba(232,80,80,.30);  }
    .warnTag  { border-color: rgba(232,160,32,.40); color: var(--warn); background: rgba(232,160,32,.08); }
    .koWarn   { animation: pulse-warn .9s ease-in-out infinite alternate; }
    @keyframes pulse-warn { to { border-color: var(--warn); } }

    /* ── Filter bar ── */
    .filters {
      display: flex; gap: 6px; overflow-x: auto;
      margin: 12px 0; scrollbar-width: none; padding-bottom: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter { white-space: nowrap; padding: 7px 12px; min-height: 34px; font-size: 13px; }
    .filter.groupFilter { min-width: 36px; justify-content: center; padding: 7px 8px; }
    .filter.active { background: rgba(212,165,32,.12); border-color: var(--gold-line); color: var(--gold2); }
    .searchBox { min-width: 200px; flex: 1; }

    /* ── Match card ── */
    .match { padding: 0; overflow: hidden; }
    .matchHead {
      padding: 10px 14px;
      background: linear-gradient(90deg, rgba(212,165,32,.08), transparent);
      border-bottom: 1px solid var(--line2);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .matchBody { padding: 14px; }
    .matchStageLine { display: none; } /* handled by badges */

    /* Teams layout — always 3-col, never wraps */
    .teams {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: center; gap: 6px;
      margin: 10px 0;
    }
    .team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .team.away { justify-content: flex-end; flex-direction: row-reverse; }
    body[dir=rtl] .team       { flex-direction: row-reverse; }
    body[dir=rtl] .team.away  { flex-direction: row; }
    .flagImg {
      width: 26px; height: 18px; flex-shrink: 0;
      border-radius: 3px; object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      background: #1a3a22;
    }
    .flagFallback { font-size: 18px; flex-shrink: 0; }
    .teamName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .vs {
      text-align: center; color: var(--dim);
      font-family: var(--font-display); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* ── SCOREBOARD score inputs — the signature element ── */
    .scorebox {
      display: flex; align-items: center;
      justify-content: center; gap: 0; margin: 10px 0;
      background: #070F0A;
      border: 1px solid rgba(212,165,32,.20);
      border-radius: 10px;
      overflow: hidden;
      max-width: 200px; margin-inline: auto;
    }
    .scorebox input {
      width: 72px; flex: 1;
      text-align: center;
      font-family: var(--font-score);
      font-size: 28px; font-weight: 900;
      color: var(--gold2);
      background: transparent;
      border: none; border-radius: 0;
      padding: 10px 4px;
      letter-spacing: .04em;
      -moz-appearance: textfield;
    }
    .scorebox input::-webkit-inner-spin-button,
    .scorebox input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scorebox input:focus { box-shadow: none; border: none; background: rgba(212,165,32,.06); }
    .scorebox input:disabled { color: var(--muted); }
    .scoreDash {
      width: 1px; align-self: stretch;
      background: rgba(212,165,32,.20);
      flex-shrink: 0;
    }

    /* KO box */
    .koBox {
      margin-top: 8px; padding: 10px;
      border-radius: var(--r2);
      background: rgba(212,165,32,.03);
      border: 1px dashed rgba(212,165,32,.15);
    }

    /* match locked state */
    .match.locked .matchHead {
      background: linear-gradient(90deg, rgba(255,255,255,.025), transparent);
    }
    .match.locked .scorebox { border-color: var(--line); }
    .match.locked .scorebox input { color: var(--muted); }

    /* ── Status pills ── */
    .matchBadges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .groupBadge {
      width: 32px; height: 26px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px; font-family: var(--font-display);
      font-size: 14px; font-weight: 900; color: #0B1F12; border: none;
      box-shadow: var(--shadow-sm);
    }
    .groupBadge span { font-size: 9px; margin-inline-end: 1px; opacity: .7; }
    .group-a{background:#7DD3FC}.group-b{background:#FCA5A5}.group-c{background:#86EFAC}
    .group-d{background:#FCD34D}.group-e{background:#C4B5FD}.group-f{background:#67E8F9}
    .group-g{background:#6EE7B7}.group-h{background:#F9A8D4}.group-i{background:#A5B4FC}
    .group-j{background:#DDB892}.group-k{background:#A7F3D0}.group-l{background:#93C5FD}

    .stageTag { background: rgba(212,165,32,.10); border-color: var(--gold-line); color: var(--gold2); font-weight: 700; }
    .roundTag { background: rgba(74,184,200,.10); border-color: rgba(74,184,200,.35); color: var(--done); font-weight: 700; }
    .statusTag.open   { color: var(--good); border-color: rgba(82,201,122,.30); }
    .statusTag.locked { color: var(--warn); border-color: rgba(232,160,32,.30); background: rgba(232,160,32,.06); }
    .statusTag.done   { color: var(--done); border-color: rgba(74,184,200,.30); background: rgba(74,184,200,.06); }

    /* ── Quick stats ── */
    .quickCard { padding: 14px; }
    .quickHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .quickHead h2 { font-size: 16px; }
    .quickStats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .stat {
      padding: 12px; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--line2);
      min-height: 68px;
    }
    .stat b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 900; line-height: 1.05; margin-top: 4px; }
    .stat .tiny { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.main {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(212,165,32,.12), rgba(212,165,32,.04));
      border-color: var(--gold-line);
    }
    .stat.main b { font-size: 30px; color: var(--gold2); }
    .progress { height: 6px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s ease; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line2); text-align: start; vertical-align: middle; }
    th { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg2); position: sticky; top: 0; }
    tr:hover td { background: rgba(212,165,32,.03); }
    .tableWrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
    .rank1 td:first-child { color: var(--gold2); font-family: var(--font-display); font-size: 18px; font-weight: 900; }

    /* ── Rules ── */
    .ruleGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; }
    .ruleTile {
      padding: 16px; border-radius: 14px;
      background: var(--bg2); border: 1px solid var(--line2);
    }
    .ruleTile b { display: block; margin-top: 6px; font-family: var(--font-display); font-size: 24px; font-weight: 900; color: var(--gold2); }

    /* ── Admin layout ── */
    .adminLayout { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
    .side {
      position: sticky; top: 132px;
      display: grid; gap: 4px;
      background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px;
    }
    .side button { text-align: start; justify-content: flex-start; border-color: transparent; background: transparent; }
    .side button:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
    .side button.active {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; border-color: transparent;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; z-index: 100; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel2); border: 1px solid var(--line);
      box-shadow: var(--shadow); border-radius: var(--r);
      padding: 12px 18px; max-width: min(92vw, 480px);
      font-family: var(--font-body); font-size: 14px;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(10px); } }
    .toast.err { border-color: rgba(232,80,80,.50); color: #ffcaca; }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: var(--r); min-height: 130px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Group standings ── */
    .standingsGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px,1fr)); gap: 12px; }
    .groupTitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .groupTitle h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
    .groupMeta { font-size: 11px; color: var(--muted); }
    .groupLetterBig { width: 40px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 900; color: #0B1F12; flex-shrink: 0; }
    .rankCell { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
    .standingsTable { min-width: 320px; }
    .standingsTable td, .standingsTable th { padding: 8px 6px; }
    .flagFallback { display: none; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .adminLayout { grid-template-columns: 1fr; }
      .quickStats { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .stat.main { grid-column: span 1; }
      .stat b { font-size: 18px; }
      .stat.main b { font-size: 22px; }
      .topInner { align-items: flex-start; padding: 10px 14px; }
      .side { position: static; display: flex; overflow-x: auto; flex-wrap: nowrap; }
      .side button { white-space: nowrap; }
      .appShell { padding-inline: 12px; }
      .card { padding: 14px; border-radius: 14px; }
      .nav { top: 68px; }
      .logo { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
      h1 { font-size: 17px; }
      .standingsGrid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .quickStats { grid-template-columns: 1fr 1fr; }
      .stat.main { grid-column: span 2; }
      .playerHeroText { display: none; }
      .grid { grid-template-columns: 1fr; }
      .teamName { font-size: 13px; }
      .scorebox input { font-size: 24px; width: 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  
    /* ══════════════════════════════════════════
       THEMES  —  applied via html[data-theme]
       Default (no attr) = Pitch Green (current)
    ══════════════════════════════════════════ */

    /* ── Night Sky (deep navy + electric violet) ── */
    html[data-theme="night"] {
      --bg:        #0A0D1A;
      --bg2:       #0D1120;
      --panel:     #111727;
      --panel2:    #151D30;
      --text:      #E8EEFF;
      --muted:     #6B7DB3;
      --dim:       #3D4D7A;
      --gold:      #7C6FED;
      --gold2:     #A89CF7;
      --gold-glow: rgba(124,111,237,.22);
      --gold-line: rgba(124,111,237,.30);
      --focus:     0 0 0 3px rgba(124,111,237,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="night"] body {
      background-image:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(124,111,237,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 100% 100%, rgba(20,15,50,.8) 0%, transparent 50%);
    }

    /* ── Desert Sand (warm amber + terracotta) ── */
    html[data-theme="desert"] {
      --bg:        #1A1208;
      --bg2:       #1F1710;
      --panel:     #271B0E;
      --panel2:    #2E2012;
      --text:      #F5EDD8;
      --muted:     #9A8060;
      --dim:       #5C4A2A;
      --gold:      #E07820;
      --gold2:     #F5A040;
      --gold-glow: rgba(224,120,32,.22);
      --gold-line: rgba(224,120,32,.32);
      --focus:     0 0 0 3px rgba(224,120,32,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="desert"] body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(224,120,32,.10) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 0% 80%, rgba(40,20,5,.7) 0%, transparent 50%);
    }

    /* ── Ice (silver + cyan, light mode) ── */
    html[data-theme="ice"] {
      --bg:        #EEF2F7;
      --bg2:       #E4EAF2;
      --panel:     #FFFFFF;
      --panel2:    #F8FAFC;

    html[data-theme="ca"]{--bg:#4A0E12;--bg2:#5E1318;--panel:#6E171D;--panel2:#801C23;--text:#FBF0F0;--muted:#DBA8A4;--dim:#9E5E5A;--gold:#FFFFFF;--gold2:#FFFFFF;--gold-glow:rgba(255,255,255,.14);--gold-line:rgba(255,255,255,.22);--focus:0 0 0 3px rgba(255,255,255,.30);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.05)}

    html[data-theme="us"]{--bg:#0C1F47;--bg2:#122A5E;--panel:#14306A;--panel2:#183A7C;--text:#F2F5FB;--muted:#9AB0D6;--dim:#4E66A0;--gold:#8FB8F0;--gold2:#8FB8F0;--gold-glow:rgba(58,111,196,.20);--gold-line:rgba(143,184,240,.30);--focus:0 0 0 3px rgba(58,111,196,.35);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.04)}
    html[data-theme="nl"]{--bg:#3A1B00;--bg2:#4A2400;--panel:#542A02;--panel2:#633303;--text:#FBF3EA;--muted:#D2B193;--dim:#8A6A48;--gold:#FF9A3D;--gold2:#FF9A3D;--gold-glow:rgba(255,122,0,.24);--gold-line:rgba(255,140,26,.34);--focus:0 0 0 3px rgba(255,122,0,.35);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.04)}
    /* Japan — light theme (white + rising-sun red) */
    html[data-theme="jp"]{--bg:#F4F1F2;--bg2:#EBE6E7;--panel:#FFFFFF;--panel2:#FBF8F9;--text:#1A1012;--muted:#8A6A6E;--dim:#C0A6AA;--gold:#E8344B;--gold2:#FF6B7A;--gold-glow:rgba(188,0,45,.12);--gold-line:rgba(188,0,45,.22);--focus:0 0 0 3px rgba(188,0,45,.25);--line:rgba(0,0,0,.10);--line2:rgba(0,0,0,.06);--shadow:0 4px 20px rgba(0,0,0,.10);--shadow-sm:0 1px 4px rgba(0,0,0,.08);--good:#18A060;--warn:#D07000;--bad:#C83030}
    html[data-theme="jp"] body{background-image:radial-gradient(ellipse 80% 40% at 50% -10%, rgba(188,0,45,.06) 0%, transparent 55%),radial-gradient(ellipse 60% 60% at 100% 100%, rgba(255,225,230,.5) 0%, transparent 50%)}
    html[data-theme="jp"] button, html[data-theme="jp"] input, html[data-theme="jp"] select{background:#FFFFFF}
    html[data-theme="jp"] .ghost{background:rgba(0,0,0,.05)}
    html[data-theme="jp"] .tab{background:rgba(0,0,0,.04)}
    html[data-theme="jp"] .card{background:#FFFFFF}
    html[data-theme="jp"] .card.soft{background:rgba(0,0,0,.03)}
    html[data-theme="jp"] .scorebox{background:#1A1012}
    html[data-theme="jp"] .scorebox input{background:transparent}
    html[data-theme="jp"] .topbar{background:rgba(244,241,242,.92)}
    html[data-theme="jp"] .pill{background:rgba(0,0,0,.04)}
    html[data-theme="jp"] .stat{background:rgba(0,0,0,.04)}
    html[data-theme="jp"] .side{background:rgba(0,0,0,.04)}
    html[data-theme="jp"] .nav{background:linear-gradient(180deg,#F4F1F2 60%,transparent)}
  
    /* ── Match card result colour-coding ── */
    .match.res-exact  { border-color: rgba(82,201,122,.55);  box-shadow: 0 0 0 1px rgba(82,201,122,.20),  var(--shadow); }
    .match.res-outcome{ border-color: rgba(212,165,32,.45);  box-shadow: 0 0 0 1px rgba(212,165,32,.15),  var(--shadow); }
    .match.res-wrong  { border-color: rgba(232,80,80,.45);   box-shadow: 0 0 0 1px rgba(232,80,80,.15),   var(--shadow); }
    .match.res-exact  .matchHead { background: linear-gradient(90deg,rgba(82,201,122,.10),transparent); }
    .match.res-outcome .matchHead{ background: linear-gradient(90deg,rgba(212,165,32,.10),transparent); }
    .match.res-wrong  .matchHead { background: linear-gradient(90deg,rgba(232,80,80,.10),transparent);  }
    .resultBadge { font-family: var(--font-display); font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill); }
    .resultBadge.exact   { color: var(--good); background: rgba(82,201,122,.12);  border: 1px solid rgba(82,201,122,.30); }
    .resultBadge.outcome { color: var(--gold2);background: rgba(212,165,32,.10);  border: 1px solid rgba(212,165,32,.25); }
    .resultBadge.wrong   { color: var(--bad);  background: rgba(232,80,80,.10);   border: 1px solid rgba(232,80,80,.25);  }
    .resultBadge.nopred  { color: var(--muted);background: transparent; border: 1px solid var(--line2); }
    .resultScore { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing:.02em; }

    /* ── Group standings ── */
    .standingsGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(340px,1fr)); gap: 12px; }
    .groupTitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .groupTitle h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
    .groupMeta { font-size: 11px; color: var(--muted); }
    .groupLetterBig { width: 40px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 900; color: #0B1F12; flex-shrink: 0; }
    .rankCell { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
    .standingsTable { min-width: 300px; }
    .standingsTable td,.standingsTable th { padding: 8px 6px; font-size: 13px; }
    .qualified-1 td:first-child { color: var(--good); }
    .qualified-2 td:first-child { color: var(--gold2); }

    /* ── Admin matrix ── */
    .matrixWrap { overflow: auto; max-height: 75vh; }
    .matrixTable { border-collapse: collapse; min-width: 900px; }
    .matrixTable th,.matrixTable td { padding: 6px 8px; border: 1px solid var(--line2); text-align: center; font-size: 12px; white-space: nowrap; }
    .matrixTable th { background: var(--bg2); font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing:.04em; position: sticky; top: 0; z-index: 2; }
    .matrixTable th.stickyCol { left: 0; z-index: 3; }
    .matrixTable td.stickyCol { position: sticky; left: 0; background: var(--panel); font-weight: 600; font-size: 13px; text-align: start; padding-inline: 10px; }
    .matrixTable td.mxExact   { background: rgba(82,201,122,.18);  color: var(--good); font-weight: 700; }
    .matrixTable td.mxOutcome { background: rgba(212,165,32,.14);  color: var(--gold2);font-weight: 700; }
    .matrixTable td.mxWrong   { background: rgba(232,80,80,.14);   color: var(--bad);  font-weight: 700; }
    .matrixTable td.mxNone    { color: var(--dim); }
    .matrixTable td.mxTotal   { background: var(--panel2); font-family: var(--font-display); font-size: 15px; font-weight: 900; position: sticky; right: 0; }

  
    .betBox{margin-top:10px;padding:10px;border-radius:var(--r2);background:rgba(212,165,32,.04);border:1px solid rgba(212,165,32,.18)}
    .betBox.hasBet{background:rgba(82,201,122,.05);border-color:rgba(82,201,122,.25)}
    .betOddsBar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:6px 0;background:var(--line2)}
    .betOddsH{background:var(--gold);height:100%;transition:width .4s}
    .betOddsA{background:var(--done);height:100%;transition:width .4s}
    .betTag{font-family:var(--font-display);font-size:12px;font-weight:700;padding:3px 8px;border-radius:var(--r-pill)}
    .betTag.won{color:var(--good);background:rgba(82,201,122,.12);border:1px solid rgba(82,201,122,.30)}
    .betTag.lost{color:var(--bad);background:rgba(232,80,80,.12);border:1px solid rgba(232,80,80,.25)}
    .betTag.pending{color:var(--muted);background:transparent;border:1px solid var(--line2)}
    .balancePill{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--gold2);background:rgba(212,165,32,.10);border:1px solid rgba(212,165,32,.25);padding:4px 10px;border-radius:var(--r-pill)}

  
    /* ── Leaderboard ── */
    .podium { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
    .podiumCard {
      border-radius: var(--r); padding: 16px 12px; text-align: center;
      border: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative; overflow: hidden;
    }
    .podiumCard.p1 { border-color: rgba(212,165,32,.50); background: linear-gradient(160deg,rgba(212,165,32,.12),var(--panel)); }
    .podiumCard.p2 { border-color: rgba(180,180,200,.35); background: linear-gradient(160deg,rgba(180,180,200,.08),var(--panel)); }
    .podiumCard.p3 { border-color: rgba(180,120,60,.35);  background: linear-gradient(160deg,rgba(180,120,60,.08),var(--panel)); }
    .podiumCard.me { box-shadow: 0 0 0 2px var(--gold); }
    .podiumMedal { font-size: 28px; line-height: 1; }
    .podiumName { font-family: var(--font-display); font-weight: 700; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
    .podiumPts { font-family: var(--font-display); font-weight: 900; font-size: 28px; color: var(--gold2); line-height: 1; }
    .podiumCard.p2 .podiumPts, .podiumCard.p3 .podiumPts { color: var(--text); font-size: 24px; }
    .podiumSub { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .podiumGap { font-size: 11px; color: var(--bad); }

    /* Rest-of-board row cards */
    .boardRow {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-bottom: 1px solid var(--line2);
    }
    .boardRow:last-child { border-bottom: none; }
    .boardRow.myRow { background: rgba(212,165,32,.06); }
    .boardRank { font-family: var(--font-display); font-weight: 900; font-size: 17px; color: var(--muted); min-width: 26px; text-align: center; flex-shrink: 0; }
    .boardMain { flex: 1; min-width: 0; }
    .boardName { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .boardSub  { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; }
    .boardSubItem { display: flex; align-items: center; gap: 3px; }
    .boardPts  { font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--gold2); flex-shrink: 0; text-align: end; }
    .boardGap  { font-size: 11px; color: var(--bad); flex-shrink: 0; text-align: end; min-width: 28px; }
    .youBadge  { font-size: 10px; font-family: var(--font-display); font-weight: 700; color: var(--gold2); background: rgba(212,165,32,.15); border: 1px solid rgba(212,165,32,.30); border-radius: 99px; padding: 1px 6px; flex-shrink: 0; }
    /* Podium sub stats — also use W/L/P */
    .podiumSub { font-size: 11px; color: var(--muted); line-height: 1.5; }

  
    .throneBox{width:100%;margin-top:10px;background:rgba(212,165,32,.08);border:1px solid rgba(212,165,32,.25);border-radius:10px;padding:10px}
    .throneQuote{font-size:14px;line-height:1.6;color:var(--text);font-style:italic;word-break:break-word;margin:0}
    .throneQuote::before{content:'\1F4AC ';font-style:normal}
    .throneInput{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(212,165,32,.30);border-radius:8px;padding:8px 10px;font-size:16px;color:var(--text);resize:none;font-family:var(--font-body);margin-bottom:6px;box-sizing:border-box;min-height:60px;-webkit-appearance:none}
    .throneCount{font-size:11px;color:var(--muted);text-align:end;margin-bottom:4px}

  
    .match.urgent{border-color:rgba(232,80,80,.60);box-shadow:0 0 0 1px rgba(232,80,80,.25),var(--shadow);animation:urgentPulse 2s ease-in-out infinite}
    .match.urgent .matchHead{background:linear-gradient(90deg,rgba(232,80,80,.12),transparent)}
    @keyframes urgentPulse{0%,100%{box-shadow:0 0 0 1px rgba(232,80,80,.25),var(--shadow)}50%{box-shadow:0 0 0 3px rgba(232,80,80,.45),var(--shadow)}}
    .countdownPill{font-family:var(--font-display);font-weight:700;font-size:12px;padding:3px 8px;border-radius:var(--r-pill);color:var(--bad);background:rgba(232,80,80,.10);border:1px solid rgba(232,80,80,.35);animation:urgentPulse 2s ease-in-out infinite}
    .missingBanner{background:rgba(232,80,80,.08);border:1px solid rgba(232,80,80,.30);border-radius:var(--r2);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .bannerText{font-size:13px;color:var(--bad);font-weight:600}
    .bannerSub{font-size:12px;color:var(--muted)}
    @media(prefers-reduced-motion:reduce){.match.urgent,.countdownPill{animation:none!important}}
    @media(max-width:400px){.podium{grid-template-columns:1fr 1fr}.podiumCard.p1{grid-column:1/-1;order:-1}.podiumCard.p2{order:0}.podiumCard.p3{order:1}}

  
    /* ── In-card result display ── */
    .resultDisplay {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--r2);
    }
    .resultTeams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }
    .resultName {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .resultName.right { text-align: end; }
    .resultScore {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 22px;
      color: var(--text);
      text-align: center;
      white-space: nowrap;
      letter-spacing: .02em;
    }
    .resultPen {
      font-size: 11px;
      font-weight: 700;
      color: var(--done);
      background: rgba(74,184,200,.12);
      border: 1px solid rgba(74,184,200,.30);
      border-radius: 4px;
      padding: 1px 4px;
      vertical-align: middle;
    }
    .resultWinner {
      margin-top: 5px;
      font-size: 12px;
      color: var(--good);
      font-weight: 600;
      text-align: center;
    }

  
    .predDrop{margin-top:8px;border-top:1px solid var(--line2);padding-top:8px}
    .predDrop summary{font-size:12px;color:var(--gold2);cursor:pointer;font-family:var(--font-display);font-weight:700;list-style:none;user-select:none}
    .predDrop summary::-webkit-details-marker{display:none}
    .predDrop summary::before{content:'▸ ';transition:transform .2s}
    .predDrop[open] summary::before{content:'▾ '}
    .predList{margin-top:8px;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
    .predRow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:4px 8px;background:rgba(0,0,0,.15);border-radius:6px}
    .predName{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .predScore{font-family:var(--font-display);font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}

    /* ── Knockout bracket ── */
    .koBar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .koLegend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
    .koLegend .pill{font-size:11px}

    /* shared match card */
    .koMatch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:152px;box-shadow:var(--shadow-sm)}
    .koMatch.done{border-color:var(--gold-line)}
    .koMatchTop{display:flex;align-items:center;gap:6px;margin-bottom:5px}
    .koNo{font:700 10px/1 var(--font-display);color:var(--gold2);background:rgba(212,165,32,.12);border:1px solid var(--gold-line);border-radius:999px;padding:2px 6px;letter-spacing:.04em}
    .koPen{font:700 10px/1 var(--font-display);color:#0B1F12;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:999px;padding:2px 6px}
    .koTime{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap}
    .koTeamRow{display:flex;align-items:center;gap:6px;padding:3px 3px;border-radius:6px}
    .koTeamRow+.koTeamRow{margin-top:2px}
    .koTeamRow .team{flex:1;min-width:0}
    .koTeamRow .teamName{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .koScore{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--text);min-width:14px;text-align:center}
    .koTeamRow.win{background:rgba(82,201,122,.12)}
    .koTeamRow.win .teamName{color:var(--good);font-weight:700}
    .koTeamRow.win .koScore{color:var(--good)}
    .koTeamRow.lose{opacity:.45}
    .koSlot.ph{font-size:12px;color:var(--muted);font-style:italic;padding:2px 0}

    /* tree (split bracket) */
    .bracketScroll{overflow-x:auto;padding:8px 2px 16px}
    .bracketScroll::-webkit-scrollbar{height:8px}
    .bracketScroll::-webkit-scrollbar-thumb{background:var(--gold-line);border-radius:999px}
    .bracketTree{display:flex;align-items:stretch;justify-content:center;min-width:max-content}
    .halfTree{display:flex;align-items:center}
    .branch{display:flex;align-items:center}
    .branch>.children{display:flex;flex-direction:column;justify-content:center;position:relative}
    .branch>.children>*{margin:6px 0;position:relative}
    .halfTree.left .branch{flex-direction:row}
    .halfTree.left .branch>.children>.branch::after,
    .halfTree.left .branch>.children>.leaf::after{content:'';position:absolute;right:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.left .branch>.children::before{content:'';position:absolute;right:-14px;top:25%;bottom:25%;width:2px;background:var(--gold-line)}
    .halfTree.left .branch>.parent{margin-left:28px;position:relative}
    .halfTree.left .branch>.parent::before{content:'';position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.left>.branch>.parent::after{content:'';position:absolute;right:-20px;top:50%;width:20px;height:2px;background:var(--gold-line)}
    .halfTree.right .branch{flex-direction:row-reverse}
    .halfTree.right .branch>.children>.branch::after,
    .halfTree.right .branch>.children>.leaf::after{content:'';position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.right .branch>.children::before{content:'';position:absolute;left:-14px;top:25%;bottom:25%;width:2px;background:var(--gold-line)}
    .halfTree.right .branch>.parent{margin-right:28px;position:relative}
    .halfTree.right .branch>.parent::before{content:'';position:absolute;right:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.right>.branch>.parent::after{content:'';position:absolute;left:-20px;top:50%;width:20px;height:2px;background:var(--gold-line)}
    .centerCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 8px;align-self:center}
    .finalBox{display:flex;flex-direction:column;align-items:center;gap:5px}
    .champCrown{font-size:26px;line-height:1}
    .finalBox .koMatch{min-width:172px;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-line),0 6px 20px var(--gold-glow)}
    .thirdBox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
    .koRoundCap{font:700 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}
    .koRoundCap.muted2{color:var(--muted)}
  </style>
</head>

const $=id=>document.getElementById(id);
let STATE=null, PREDS={}, BETS_STATE={pools:{},myBets:{},balance:null}, HIDDEN_TABS=[], LANG=localStorage.getItem('wc26lang')||'en', SESSION=JSON.parse(localStorage.getItem('wc26session')||'null'), ADMIN_PIN=localStorage.getItem('wc26admin')||'', ACTIVE='pred', FILTER='all', SAVE_TIMER=null, DIRTY=false, SAVING=false;
const T={en:{title:"WC '26 Prediction League",sub:'Riyadh time GMT+3 · Auto-save · Bilingual',refresh:'Refresh',firstSetup:'First setup',setupText:'Create the league by choosing a 4-digit admin PIN. Keep it private.',adminPin4:'Admin PIN, 4 digits',createLeague:'Create league',predictions:'Predictions',odds:'Odds',leaderboard:'Leaderboard',groups:'Groups',groupsHelp:'Group tables are calculated from the results entered by admin/API. Ranking uses points, goal difference, goals for, then team name.',bracket:'Knockout',bracketHelp:'The bracket fills in automatically as results are entered — winners advance to the next round. In the tree view, scroll sideways to follow each path to the final.',rules:'Rules',admin:'Admin',playerArea:'Player area',playerHelp:'Choose your slot, enter your PIN, and predict. Changes auto-save after you stop typing.',displayNameOnce:'Display name, first login only',pin4:'4-digit PIN',login:'Login',logout:'Logout',saveNow:'Save now',quickStats:'Quick stats',saved:'Saved',saving:'Saving…',unsaved:'Unsaved changes',loginFirst:'Login first',locked:'Locked',open:'Open',today:'Today',upcoming:'Upcoming',completed:'Completed',all:'All',mine:'Missing picks',searchTeams:'Search team or stage',group:'Group',roundOf32:'Round of 32',roundOf16:'Round of 16',quarterFinal:'Quarter-final',semiFinal:'Semi-final',thirdPlace:'Third place',final:'Final',nameLocked:'Name already chosen. You can login with PIN only.',nameAvailable:'Optional: choose your display name now. You can do this once.',odds:'Odds',oddsTitle:'Prediction odds',oddsHelp:'These odds are calculated from participant picks. They become more useful after players submit predictions.',draw:'Draw',penalties:'Penalties',winner:'Winner',predictPens:'Reaches penalties',rank:'Rank',player:'Player',points:'Points',team:'Team',exact:'Exact',outcome:'Winner/Draw',wrong:'Wrong KO',predictedPlayed:'Predicted played',rulesTitle:'Scoring rules',adminPin:'Admin PIN',players:'Players',matches:'Matches',results:'Results',viewPredictions:'View predictions',apiSync:'API Sync',reset:'Reset',savePlayerNames:'Save player names',resetPin:'Reset PIN',pinSet:'PIN set',noPin:'No PIN yet',matchSetup:'Match setup',stage:'Stage',home:'Home',away:'Away',kickoff:'Kick-off',saveMatchSetup:'Save match setup',resultsHelp:'Admin can edit API results manually here. For knockout draws, choose whether penalties happened and who advanced.',saveResults:'Save results',prediction:'Prediction',result:'Result',scorePoints:'Points',noPrediction:'No prediction',apiHelp:'Save your football-data.org token privately, then sync results. Manual edits remain available.',apiToken:'API token',saveApiToken:'Save API token',syncNow:'Sync now',enableAutoSync:'Enable hourly auto-sync',disableAutoSync:'Disable auto-sync',typeReset:'Type RESET',resetLeagueLink:'Reset league link',wrongAdmin:'Wrong admin PIN',empty:'Nothing to show yet',adminTabPlayers:'👤 Players',adminTabMatrix:'📊 Scores',adminTabMatches:'📅 Matches',adminTabResults:'⚽ Results',adminTabPreds:'🔍 Predictions',adminTabBets:'🎲 Bets',adminTabAdjust:'⚖️ Adjust',adminTabSync:'🔄 API Sync',adminTabReset:'🗑️ Reset',hideTabs:'Manage tabs',hideTabsHelp:'Show or hide tabs for all players. Admin always sees all tabs.',adminTabVis:'👁️ Pred Visibility',adminTabChampion:'🌍 Champion',adminTabHide:'👁️ Tabs',adjustPoints:'Adjust points',adjustHelp:'Add or subtract points from a player. Use for corrections, bonuses, or penalties.',adjustment:'Adjustment',reason:'Reason',note:'Note',bonus:'Bonus',penalty:'Penalty',correction:'Correction',adjustHistory:'Adjustment history',leaderboardTitle:'Leaderboard',youLabel:'You',behindLeader:'behind leader',betting:'Betting',bettingHelp:'Bet your prediction points on R16+ matches. Predictions and bets both count — place a bet on top of your prediction for extra reward or risk. Winners share the pool.',balance:'Balance',placeBet:'Place bet',cancelBet:'Cancel bet',allIn:'🔥 All In',betAmount:'Bet amount',pool:'Pool',yourBet:'Your bet',betWon:'Won',betLost:'Lost',betPending:'Pending',noBets:'No bets placed yet',betForfeits:'⚠️ Bet replaces prediction score',championTitle:'Champion Prediction',championHelp:'Pick the World Cup winner before June 19 midnight (Riyadh) for +20 if correct. You get one switch until July 4, 19:55 — a switched pick is worth +10.',championPick:'Your pick',championLock:'Locked June 19 midnight',championCorrect:'🏆 Correct!',championWrong:'✗ Wrong',championNoPick:'No pick yet',championWinner:'Actual champion',setChampionWinner:'Set champion winner',saveChampionPick:'Save champion pick',scoreMatrix:'Score matrix',deleteResult:'Delete result',renamePlayer:'Rename',forcePin:'Set PIN',clearPreds:'Clear picks',confirmClear:'Type CLEAR to wipe this player\'s predictions',totalPoints:'Total',rulesHtml:`
<div style="display:flex;flex-direction:column;gap:16px">

  <div class="ruleTile" style="border-color:rgba(212,165,32,.35);background:rgba(212,165,32,.06)">
    <span style="font-size:22px">🏆</span>
    <b style="font-size:17px;margin:6px 0 4px;display:block">How to play</b>
    <p style="color:var(--muted);margin:0;line-height:1.6">
      Predict the score of every match. The closer your prediction, the more points you earn.
      Points build up across all 104 matches. The player with the most points at the end wins the league.
    </p>
  </div>

  <div style="font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-8px">Scoring — Group Stage (Matches 1–72)</div>
  <div class="ruleGrid">
    <div class="ruleTile">🎯 Exact score<b>+2 pts</b><span style="color:var(--muted);font-size:12px">Correct scoreline</span></div>
    <div class="ruleTile">✅ Correct result<b>+1 pt</b><span style="color:var(--muted);font-size:12px">Win / Draw / Loss</span></div>
    <div class="ruleTile">❌ Wrong result<b>0 pts</b><span style="color:var(--muted);font-size:12px">No penalty in groups</span></div>
  </div>

  <div style="font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-8px">Scoring — Knockout Rounds</div>
  <div class="ruleGrid">
    <div class="ruleTile">🎯 Exact score<b>R32 +6 · R16 +8 · QF +12<br>SF +20 · Final +32</b></div>
    <div class="ruleTile">✅ Correct team advances<b>R32 +3 · R16 +4 · QF +6<br>SF +10 · Final +16</b></div>
    <div class="ruleTile">❌ Wrong team<b>R32 −3 · R16 −4 · QF −6<br>SF −10 · Final −16</b><span style="color:var(--muted);font-size:12px">Penalty applies in KO only</span></div>
  </div>

  <div class="ruleTile" style="border-color:rgba(74,184,200,.35)">
    <span style="font-size:18px">🔄</span>
    <b style="display:block;margin:4px 0">Penalty shootouts (KO only)</b>
    <p style="color:var(--muted);margin:0;font-size:13px;line-height:1.6">
      If you predict a draw in a KO match, tick "Reaches penalties" and pick the team you think advances.
      To score full exact points you need: correct 120-min score + penalties ticked + correct advancing team.
      Predict the right team advancing without ticking penalties = correct team points only.
    </p>
  </div>

  <div class="ruleTile" style="border-color:rgba(82,201,122,.35);background:rgba(82,201,122,.05)">
    <span style="font-size:18px">🛟</span>

    <p style="color:var(--muted);margin:0;font-size:13px;line-height:1.6">
      Your point total can never drop below <b>0</b>. Knockout penalties and lost bets can knock you down, but never bury you — a player at 0 simply earns back up through predictions. You can only ever bet points you currently hold.
    </p>
  </div>

  <div class="ruleTile" style="border-color:rgba(212,165,32,.35)">
    <span style="font-size:18px">🌍</span>
    <b style="display:block;margin:4px 0">Champion prediction</b>

      You get <b>one switch</b> any time up to <b>July 4, 19:55</b> (just before the Round of 16); a switched pick pays <b style="color:var(--gold2)">+10</b> if correct. After that it's final. No penalty for a wrong pick.

  <div class="ruleTile" style="border-color:rgba(232,80,80,.35);background:rgba(232,80,80,.04)">

    <p style="color:var(--muted);margin:0;font-size:13px;line-height:1.6">
      Once the knockout rounds begin you can bet your prediction points on match outcomes.
      <b>No minimum bet · Max bet: 50% of your balance</b> (except the Final — you can go All In 🔥).

function _scoreOnClient(pred, result, matchNo, stage) {
  // Mirrors server _scoreOne but client-side for card display
  if (!pred || !result) return null;
  const ko = matchNo >= 73;
  const hg = Number(pred.hg), ag = Number(pred.ag);
  if (isNaN(hg) || isNaN(ag)) return null;
  const rhg = Number(result.hg), rag = Number(result.ag);
  const scoreExact = hg === rhg && ag === rag;
  const predW = hg > ag ? 'H' : ag > hg ? 'A' : (pred.w || 'D');
  const resW  = rhg > rag ? 'H' : rag > rhg ? 'A' : (result.w || 'D');
  const correctQ = resW !== 'D' && predW === resW;
  if (!ko) {
    if (scoreExact) return {cls:'exact',   pts: 2};
    if (predW === resW) return {cls:'outcome', pts: 1};
    return {cls:'wrong', pts: 0};
  }
  const vals = matchNo>=101&&matchNo<=104 ? {e:32,o:16,w:-16} :
               matchNo===103             ? {e:16,o:8, w:-8}  :
               matchNo>=97&&matchNo<=100 ? {e:8, o:4, w:-4}  :
               {e:4, o:2, w:-2};
  if (!correctQ) return {cls:'wrong',   pts: vals.w};
  if (result.pen) {
    const penEx = scoreExact && pred.pen && pred.w === result.w;
    return penEx ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
  }
  return scoreExact ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
}


const URGENT_MS=2*60*60*1000;
function timeUntilLock(m){if(!m.iso)return Infinity;return new Date(m.iso).getTime()-5*60*1000-Date.now();}
function isUrgent(m){if(locked(m))return false;const t=timeUntilLock(m);return t>0&&t<=URGENT_MS;}
function hasPickForMatch(m){const p=myPred(m.no);return p.hg!==''&&p.hg!=null&&p.ag!==''&&p.ag!=null;}
function fmtCountdown(ms){if(ms<=0)return LANG==='ar'?'مغلق':'Locked';const h=Math.floor(ms/3600000),min=Math.floor((ms%3600000)/60000);if(h>0)return LANG==='ar'?`${h}س ${min}د`:`${h}h ${min}m`;return LANG==='ar'?`${min}د`:`${min}m`;}

/* Shared ordering for Predictions + Odds pages.
   Chronological, but a started/finished match stays visible among the
   current matches until the match-after-next has also kicked off.
   Concretely: a started match sinks to the bottom only once >= 2
   later-scheduled matches have started. */
function matchOrderKey(list){
  const now=Date.now();
  // Sort all by kickoff ascending first
  const byTime=list.slice().sort((a,b)=>{
    const ta=new Date(a.iso||'2999').getTime()||9e15;
    const tb=new Date(b.iso||'2999').getTime()||9e15;
    return ta-tb;
  });
  // For each match, count how many LATER matches have already started
  const started=m=>{const t=new Date(m.iso||'').getTime();return !isNaN(t)&&now>=t;};
  const idx={};
  byTime.forEach((m,i)=>idx[m.no]=i);
  return byTime.map(m=>{
    const t=new Date(m.iso||'2999').getTime()||9e15;
    const s=started(m);
    // count later matches (by schedule) that have started
    let laterStarted=0;
    for(let j=idx[m.no]+1;j<byTime.length;j++){ if(started(byTime[j])) laterStarted++; }
    // bucket: 0 = active/upcoming (keep in place), 1 = demote to bottom
    // A started match demotes only when >=2 later matches have started
    const demote = s && laterStarted>=2;
    return {m, bucket: demote?1:0, t};
  }).sort((x,y)=> x.bucket!==y.bucket ? x.bucket-y.bucket : x.t-y.t)
    .map(o=>o.m);
}

async function loadBoard(){
  const r=await call('getLeaderboard');
  const msgR={ok:true,messages:r.messages||{}};
  if(!r.ok)return $('leaderboard').innerHTML=`<p class="muted">${esc(r.msg)}</p>`;
  const table=r.table||[];
  if(!table.length){$('leaderboard').innerHTML=`<p class="muted">${LANG==='ar'?'لا يوجد بيانات بعد':'No data yet'}</p>`;return;}
  const leader=table[0].total;
  const myId=SESSION?SESSION.id:null;

  // Medal labels
  const medals=['🥇','🥈','🥉'];
  const podiumCls=['p1','p2','p3'];

  // ── Podium: top 3 ──
  let podium='<div class="podium">';
  // Reorder visually: 2nd | 1st | 3rd
  const order=[1,0,2];
  const leaderMsg=msgR&&msgR.ok?msgR.message:null;
  order.forEach(idx=>{
    const p=table[idx]; if(!p)return;
    const isMe=myId&&p.id===myId;
    const gap=p.total-leader;
    const ex=(p.exact||0),wo=(p.outcome!=null?p.outcome:Math.max(0,(p.wins||0)-(p.exact||0))),kow=(p.losses!=null?p.losses:p.wrong||0),pl=p.played||p.predictedPlayed||0; const rec=`W${wo} E${ex} L${kow} P${pl}`;
    let throne='';
    {
      // Each tied leader (max 3) shows their OWN message in their OWN card.
      const msgs=(msgR&&msgR.ok&&msgR.messages)?msgR.messages:{};
      const leaderIds=r.leaderIds||[];
      const tooMany=leaderIds.length>3;
      const isThisLeader=leaderIds.includes(p.id);
      const myMsg=msgs[p.id]||msgs[String(p.id)]||null;
      if(isThisLeader && !tooMany){
        if(SESSION && p.id===myId){
          // This is me and I'm a tied leader — show input prefilled with my message
          const cur=myMsg?esc(myMsg.msg):'';
          throne='<div class="throneBox">'+(myMsg&&myMsg.msg?'<p class="throneQuote" style="margin-bottom:8px">'+esc(myMsg.msg)+'</p>':'')+'<textarea class="throneInput" id="throneInput" maxlength="140" rows="2" oninput="updateThroneCount()" placeholder="'+(LANG==='ar'?'قل شيئاً للمجموعة...':'Say something to the group...')+'"></textarea><div class="throneCount"><span id="throneCount">0</span>/140</div><button class="primary wide" onclick="postThroneMsg()">'+(LANG==='ar'?'نشر':'Post')+'</button></div>';
        } else if(myMsg && myMsg.msg){
          // Another tied leader's message — read only
          throne='<div class="throneBox"><p class="throneQuote">'+esc(myMsg.msg)+'</p></div>';
        }
      }
    }
    podium+=`<div class="podiumCard ${podiumCls[idx]}${isMe?' me':''}"><span class="podiumMedal">${medals[idx]}</span><span class="podiumName">${esc(p.name)}${isMe?'<span class="youBadge">'+(LANG==='ar'?'\u0623\u0646\u062a':'You')+'</span>':''}</span><span class="podiumPts">${p.total}</span><span class="podiumSub">${rec}</span>${throne}</div>`;
  });
  podium+='</div>';

  // ── Rest: rank 4+ ──
  let rows='';
  table.slice(3).forEach((p,i)=>{
    const rank=i+4;
    const isMe=myId&&p.id===myId;
    const gap=p.total-leader;
    const ex=(p.exact||0);
    const wo=(p.outcome!=null?p.outcome:Math.max(0,(p.wins||0)-(p.exact||0)));
    const kow=(p.losses!=null?p.losses:p.wrong||0);
    const pl=p.played||p.predictedPlayed||0;
    rows+=`<div class="boardRow${isMe?' myRow':''}">
      <span class="boardRank">${rank}</span>
      <div class="boardMain">
        <div class="boardName">${esc(p.name)}${isMe?`<span class="youBadge">${tr('youLabel')}</span>`:''}</div>
        <div class="boardSub">
          <span class="boardSubItem" style="color:var(--good)">W${wo}</span>
          <span class="boardSubItem" style="color:var(--gold2)">E${ex}</span>
          <span class="boardSubItem" style="color:var(--bad)">L${kow}</span>
          <span class="boardSubItem">P${pl}</span>
        </div>
      </div>
      <div class="boardPts">${p.total}</div>
    </div>`;
  });
  const rest=rows?`<div class="card" style="padding:0;overflow:hidden;margin-top:0">${rows}</div>`:'';

  $('leaderboard').innerHTML=podium+rest;
}

function renderGroups(){
  if(!$('groupsBox')||!STATE)return;

  // Group tab only: FIFA-style standings.
  // Win = 3 points, Draw = 1 point, Loss = 0 points.
  // Goals For and Goals Against are counted for every team.
  let liveRosters={};
  (STATE.matches||[]).forEach(m=>{let g=getGroup(m);if(!g)return;liveRosters[g]=liveRosters[g]||new Set();if(m.h&&m.h!=='TBD')liveRosters[g].add(m.h);if(m.a&&m.a!=='TBD')liveRosters[g].add(m.a);});
  let groups={};
  'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]={};let list=(liveRosters[g]&&liveRosters[g].size===4)?Array.from(liveRosters[g]):(GROUP_ROSTERS[g]||[]);list.forEach(t=>{groups[g][t]={team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});});

  (STATE.matches||[]).forEach(m=>{
    let g=getGroup(m);
    if(!g || !groups[g])return;
    let r=STATE.results&&STATE.results[m.no];
    if(!r)return;

    let home=groups[g][m.h], away=groups[g][m.a];
    if(!home||!away)return;

    let hg=Number(r.hg), ag=Number(r.ag);
    if(isNaN(hg)||isNaN(ag))return;

    home.P++; away.P++;
    home.GF+=hg; home.GA+=ag;
    away.GF+=ag; away.GA+=hg;

    if(hg>ag){home.W++; away.L++; home.Pts+=3;}
    else if(ag>hg){away.W++; home.L++; away.Pts+=3;}
    else {home.D++; away.D++; home.Pts+=1; away.Pts+=1;}

    home.GD=home.GF-home.GA;
    away.GD=away.GF-away.GA;
  });

  let letters='ABCDEFGHIJKL'.split('');
  let html='<div class="standingsGrid">';
  letters.forEach(g=>{
    let teams=Object.values(groups[g]||{}).sort((a,b)=>
      b.Pts-a.Pts || b.GD-a.GD || b.GF-a.GF || a.team.localeCompare(b.team)
    );
    let completed=teams.reduce((s,t)=>s+t.P,0)/2 || 0;
    html+=`<div class="card soft"><div class="groupTitle">${groupBadgeHtml(g,true)}<div><h3>${esc(tr('group'))} ${g}</h3><div class="groupMeta">${completed} ${LANG==='ar'?'مباريات مكتملة':'completed matches'} · ${LANG==='ar'?'الفوز ٣ نقاط، التعادل نقطة':'Win 3 pts, draw 1 pt'}</div></div></div>`;
    html+=`<div class="tableWrap"><table class="standingsTable"><thead><tr><th>#</th><th>${tr('team')}</th><th title="Played">P</th><th title="Wins">W</th><th title="Draws">D</th><th title="Losses">L</th><th title="Goals for">GF</th><th title="Goals against">GA</th><th title="Goal difference">GD</th><th title="Points">Pts</th></tr></thead><tbody>`;
    teams.forEach((t,i)=>{
      const qCls=i===0?'qualified-1':i===1?'qualified-2':'';
      html+=`<tr class="${qCls}"><td class="rankCell">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${teamHtml(t.team)}</td><td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td><td>${t.GF}</td><td>${t.GA}</td><td>${t.GD>0?'+'+t.GD:t.GD}</td><td><b>${t.Pts}</b></td></tr>`;
    });
    html+='</tbody></table></div></div>';
  });
  $('groupsBox').innerHTML=html+'</div>';
}

let KO_BY_NO={};
const KO_FEEDERS={
  89:[73,75],90:[76,78],91:[74,77],92:[83,84],93:[79,80],94:[86,88],95:[81,82],96:[85,87],
  97:[89,90],98:[93,94],99:[91,92],100:[95,96],
  101:[97,98],102:[99,100],104:[101,102]

function koWinnerSide(no){var r=STATE.results&&STATE.results[no];if(!r)return null;var hg=Number(r.hg),ag=Number(r.ag);if(r.w==='H'||r.w==='A')return r.w;if(!isNaN(hg)&&!isNaN(ag)){if(hg>ag)return 'H';if(ag>hg)return 'A';}return null;}
function koIsPlaceholder(s){s=String(s||'').trim();if(!s||s==='TBD')return true;if(/^[WL]\d+$/i.test(s))return true;if(/^[1-3][A-L]+$/i.test(s))return true;return false;}
function koResolve(slot,depth){depth=depth||0;if(depth>10)return null;slot=String(slot||'').trim();var wl=slot.match(/^([WL])(\d+)$/i);if(wl){var no=Number(wl[2]),mm=KO_BY_NO[no];if(!mm)return null;var side=koWinnerSide(no);if(!side)return null;if(wl[1].toUpperCase()==='L')side=(side==='H'?'A':'H');return koResolve(side==='H'?mm.h:mm.a,depth+1);}if(koIsPlaceholder(slot))return null;return slot;}
function koSlotLabel(slot){var s=String(slot||'').trim();var wl=s.match(/^([WL])(\d+)$/i);if(wl){var t=wl[1].toUpperCase()==='W'?(LANG==='ar'?'الفائز':'Winner'):(LANG==='ar'?'الخاسر':'Loser');return t+' #'+wl[2];}if(!s||s==='TBD')return 'TBD';return s;}
function koSlotInner(slot){var team=koResolve(slot);if(team)return teamHtml(team);return `<span class="koSlot ph">${esc(koSlotLabel(slot))}</span>`;}
function koMatchCard(no){var m=KO_BY_NO[no];if(!m)return '';var r=STATE.results&&STATE.results[no];var done=!!r,L=locked(m),win=done?koWinnerSide(no):null;
  var hCls=win==='H'?'win':(done&&win&&win!=='H'?'lose':'');var aCls=win==='A'?'win':(done&&win&&win!=='A'?'lose':'');
  var top=`<div class="koMatchTop"><span class="koNo">#${no}</span>${r&&r.pen?`<span class="koPen">P</span>`:''}<span class="koTime">${done?(LANG==='ar'?'انتهت':'FT'):localTime(m.iso)}</span></div>`;

async function adminMatrix(){
  $('adminContent').innerHTML='<div class="skeleton"></div>';
  const r=await call('adminGetFullMatrix',ADMIN_PIN);
  if(!r.ok)return $('adminContent').innerHTML='<p class="muted">'+esc(r.msg)+'</p>';
  const matches=r.matches.filter(m=>m.result); // only show completed
  if(!matches.length){$('adminContent').innerHTML='<p class="muted">'+(LANG==='ar'?'لا توجد نتائج بعد':'No results yet')+'</p>';return;}
  let html='<div class="matrixWrap"><table class="matrixTable"><thead><tr><th class="stickyCol">'+tr('player')+'</th>';
  matches.forEach(m=>{
    const stage=stageLabel(m); const short=m.h.split(' ')[0]+' v '+m.a.split(' ')[0];
    html+=`<th title="#${m.no} ${esc(stage)}: ${esc(m.h)} vs ${esc(m.a)}">#${m.no}</th>`;
  });
  html+='<th class="stickyCol">'+tr('totalPoints')+'</th></tr></thead><tbody>';
  r.players.forEach(p=>{
    html+=`<tr><td class="stickyCol">${esc(p.name)}</td>`;
    matches.forEach(m=>{
      const c=p.cells[m.no];
      if(!c){html+='<td class="mxNone">—</td>';return;}
      let cls='mxNone', pts='?';
      if(c.points!=null){pts=(c.points>0?'+':'')+c.points;}
      if(c.exact)cls='mxExact'; else if(c.outcome)cls='mxOutcome'; else if(c.wrong)cls='mxWrong';
      const predStr=c.pred?`${c.pred.hg}-${c.pred.ag}`:'?';
      html+=`<td class="${cls}" title="${esc(predStr)}">${pts}</td>`;
    });
    html+=`<td class="mxTotal">${p.total>0?'+':''}${p.total}</td></tr>`;
  });
  html+='</tbody></table></div>';
  $('adminContent').innerHTML=html;
}

async function loadChampion(){
  if(!STATE)return;
  const box=$('championBox'); if(!box)return;
  const ch=STATE.champion||{};
  const allTeams=['Mexico','South Africa','South Korea','Czechia','Canada','Bosnia and Herzegovina','Qatar','Switzerland','Brazil','Morocco','Haiti','Scotland','United States','Paraguay','Australia','Türkiye','Germany','Curaçao',"Côte d'Ivoire",'Ecuador','Netherlands','Japan','Sweden','Tunisia','Belgium','Egypt','IR Iran','New Zealand','Spain','Cabo Verde','Saudi Arabia','Uruguay','France','Senegal','Iraq','Norway','Argentina','Algeria','Austria','Jordan','Portugal','Congo DR','Uzbekistan','Colombia','England','Croatia','Ghana','Panama'].sort();
  const myPick=SESSION?ch.myPick||'':'';
  const myOriginal=SESSION?ch.myOriginal||'':'';

  const phase=ch.phase||'early';
  const canPick=SESSION&&(ch.canPick!=null?ch.canPick:phase!=='locked');
  const bonusEarly=ch.bonusEarly||20, bonusSwitched=ch.bonusSwitched||10;

  const myChanged = phase!=='early' && myPick && ((!myOriginal)||myPick!==myOriginal);

    let pillCls,pillText;

    const valNote=myPick?`<span class="pill" style="background:rgba(212,165,32,.12);color:var(--gold2);border-color:transparent">+${myValue} ${LANG==='ar'?'إن أصبت':'if correct'}</span>`:'';

      </div>
      ${(phase==='switch'&&canPick)?`<p class="muted" style="font-size:12px;margin:8px 0 0">${LANG==='ar'?`يمكنك تغيير اختيارك بحرّية حتى القفل. التغيير يبقى مخفياً — يرى الآخرون اختيارك ليوم ١٩ يونيو حتى ٤ يوليو. التغيير يجعل قيمتك +${bonusSwitched} بدل +${bonusEarly}.`:`You can change your pick freely until the lock. Changes stay hidden — others see your June-19 pick until July 4. Changing makes your pick worth +${bonusSwitched} instead of +${bonusEarly}.`}</p>`:''}
    </div>`;
  }

  const _tbd=`<span class="muted">TBD</span>`;
  html+=`<div class="card soft"><div class="between"><h3>${tr('championWinner')}: ${winner?teamHtml(winner):_tbd}</h3></div>`;
  if(phase==='early'){

"H">${esc(m.h)}</option><option value="A">${esc(m.a)}</option></select><input id="betAmt_${m.no}" type="number" min="1" max="${maxBet}" placeholder="1–${maxBet}" style="width:90px"><button class="primary" onclick="doPlaceBet(${m.no},false)">${tr('placeBet')}</button></div>${isFinal?`<button class="danger wide" style="margin-top:6px;background:rgba(232,80,80,.15);color:var(--bad)" onclick="doPlaceBet(${m.no},true)">${tr('allIn')} (${BETS_STATE.balance||0} pts)</button>`:''}</div>`;}else{betContent=`<div class="betBox">${betOddsHtml(pool,m.h,m.a)}</div>`;}html+=`<div class="card soft"><div class="matchBadges"><span class="pill">#${m.no}</span>${stageBadge(m)}${res?`<span class="pill statusTag done">${tr('completed')}</span>`:L?`<span class="pill statusTag locked">${tr('locked')}</span>`:`<span class="pill statusTag open">${tr('open')}</span>`}</div><div class="teams">${teamHtml(m.h)}<span class="vs">VS</span>${teamHtml(m.a,'away')}</div><div class="tiny">${localTime(m.iso)}</div>${res?`<div class="tiny" style="margin-top:4px">⚽ ${res.hg}–${res.ag}${res.pen?' (pens)':''}</div>`:''} ${betContent}</div>`;});box.innerHTML=html+'</div>';}
async function doPlaceBet(matchNo,allIn){if(!SESSION)return toast(tr('loginFirst'),true);const teamSel=$('betTeam_'+matchNo),amtEl=$('betAmt_'+matchNo),team=teamSel?teamSel.value:'',amount=allIn?-1:(amtEl?Number(amtEl.value):0);if(!team)return toast(LANG==='ar'?'اختر الفريق':'Choose a team',true);if(!allIn&&amount<1)return toast(LANG==='ar'?'أدخل مبلغاً':'Enter an amount',true);const r=await call('placeBet',SESSION.id,SESSION.pin,matchNo,team,amount);if(!r.ok)return toast(r.msg,true);toast((LANG==='ar'?'تم الرهان ✓ رصيدك: ':'Bet placed ✓ Balance: ')+r.balance+' pts');BETS_STATE.balance=r.balance;loadBetting();}
async function doCancelBet(matchNo){if(!SESSION)return;if(!confirm(LANG==='ar'?'إلغاء الرهان؟':'Cancel this bet?'))return;const r=await call('cancelBet',SESSION.id,SESSION.pin,matchNo);if(!r.ok)return toast(r.msg,true);toast(LANG==='ar'?'تم الإلغاء':'Cancelled');loadBetting();}

async function adminAdjustUI() {
  $('adminContent').innerHTML = '<div class="skeleton"></div>';
  const r = await call('adminGetAdjustments', ADMIN_PIN);
  if (!r.ok) { $('adminContent').innerHTML = `<p class="muted">${esc(r.msg)}</p>`; return; }
  const players = STATE.players || [];

  // Build player select options
  const opts = players.map(p => `<option value="${p.id}">${p.id}. ${esc(p.name)}</option>`).join('');

  let html = `<div class="card soft" style="margin-bottom:14px">
    <h3>${tr('adjustPoints')}</h3>
    <p class="muted" style="margin:4px 0 12px">${tr('adjustHelp')}</p>
    <div class="row">
      <select id="adjPlayer" style="flex:1">${opts}</select>
      <input id="adjAmount" type="number" placeholder="${LANG==='ar'?'نقاط (+ أو -)':'Points (+ or -)' }" style="width:110px">
      <select id="adjReason">
        <option value="bonus">${tr('bonus')}</option>
        <option value="penalty">${tr('penalty')}</option>
        <option value="correction">${tr('correction')}</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="adjNote" class="wide" placeholder="${tr('note')} (${LANG==='ar'?'اختياري':'optional'})">
      <button class="primary" onclick="doAdminAdjust()">${tr('adjustPoints')}</button>
    </div>
  </div>`;

  // History
  const adjs = r.adjustments || [];
  if (adjs.length) {
    html += `<h3 style="margin-bottom:8px">${tr('adjustHistory')}</h3>
    <div class="tableWrap"><table><thead><tr>
      <th>${tr('player')}</th><th>${tr('adjustment')}</th><th>${tr('reason')}</th><th>${tr('note')}</th><th>Time</th><th></th>
    </tr></thead><tbody>`;
    adjs.forEach(a => {
      const sign = a.amount >= 0 ? '+' : '';
      const col  = a.amount >= 0 ? 'var(--good)' : 'var(--bad)';
      const time = new Date(a.ts).toLocaleString(LANG==='ar'?'ar-SA':'en-GB',{timeZone:'Asia/Riyadh',dateStyle:'short',timeStyle:'short'});
      html += `<tr>
        <td>${esc(a.name)}</td>
        <td style="color:${col};font-family:var(--font-display);font-weight:900">${sign}${a.amount}</td>
        <td>${esc(a.reason)}</td>
        <td>${esc(a.note)}</td>
        <td class="tiny">${time}</td>
        <td><button class="ghost danger" onclick="doDeleteAdj(${a.playerId},${a.ts})">✕</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  } else {
    html += `<p class="muted">${LANG==='ar'?'لا توجد تعديلات بعد':'No adjustments yet'}</p>`;
  }
  $('adminContent').innerHTML = html;
}

async function doAdminAdjust() {
  const pid  = Number($('adjPlayer').value);
  const amt  = Number($('adjAmount').value);
  const reason = $('adjReason').value;
  const note   = $('adjNote').value.trim();
  if (!amt || isNaN(amt)) return toast(LANG==='ar'?'أدخل مبلغاً':'Enter an amount', true);
  const r = await call('adminAdjustPoints', ADMIN_PIN, pid, amt, reason, note);
  if (!r.ok) return toast(r.msg, true);
  const sign = amt >= 0 ? '+' : '';
  toast(`${esc(r.name)}: ${sign}${r.amount} pts`);
  adminAdjustUI();
}

async function doDeleteAdj(playerId, ts) {
  if (!confirm(LANG==='ar'?'حذف هذا التعديل؟':'Delete this adjustment?')) return;
  const r = await call('adminDeleteAdjustment', ADMIN_PIN, playerId, ts);
  if (!r.ok) return toast(r.msg, true);
  toast(LANG==='ar'?'تم الحذف':'Deleted');
  adminAdjustUI();
}


function applyHiddenTabs() {
  const allTabs = ['pred','odds','board','groups','bracket','betting','champion','rules','admin'];
  const isAdmin = !!ADMIN_PIN;
  allTabs.forEach(t => {
    const btn = $('tab' + t[0].toUpperCase() + t.slice(1));
    if (!btn) return;
    const hide = !isAdmin && HIDDEN_TABS.includes(t);
    btn.style.display = hide ? 'none' : '';
    // Also hide the section element itself
    const sec = $(t);
    if (sec && hide) sec.classList.add('hidden');
  });
  // If current active tab is now hidden, redirect to pred
  if (!isAdmin && HIDDEN_TABS.includes(ACTIVE)) {
    showTab('pred');
  }
}

async function adminHideTabsUI() {
  $('adminContent').innerHTML = '<div class="skeleton"></div>';
  const r = await call('adminGetHiddenTabs', ADMIN_PIN);
  if (!r.ok) { $('adminContent').innerHTML = `<p class="muted">${esc(r.msg)}</p>`; return; }
  HIDDEN_TABS = r.hidden || [];

  const tabDefs = [
    {id:'pred',    labelEn:'🏟️ Predictions', labelAr:'🏟️ التوقعات'},
    {id:'odds',    labelEn:'📈 Odds',         labelAr:'📈 النسب'},
    {id:'board',   labelEn:'🏆 Leaderboard',  labelAr:'🏆 الترتيب'},
    {id:'groups',  labelEn:'📋 Groups',       labelAr:'📋 المجموعات'},
    {id:'bracket', labelEn:'🔱 Knockout',     labelAr:'🔱 الإقصاء'},
    {id:'betting', labelEn:'🎲 Betting',      labelAr:'🎲 الرهانات'},
    {id:'champion',labelEn:'🌍 Champion',     labelAr:'🌍 البطل'},
    {id:'rules',   labelEn:'📖 Rules',        labelAr:'📖 القوانين'},
  ];

  let html = `<p class="muted" style="margin-bottom:14px">${tr('hideTabsHelp')}</p>
  <div class="grid">`;
  tabDefs.forEach(t => {
    const hidden = HIDDEN_TABS.includes(t.id);
    const label = LANG === 'ar' ? t.labelAr : t.labelEn;
    html += `<div class="card soft" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px">
      <span style="font-size:15px;font-weight:600">${label}</span>
      <button class="${hidden ? 'ghost danger' : 'primary'}" onclick="toggleHideTab('${t.id}')" style="min-width:90px">
        ${hidden ? (LANG==='ar'?'مخفي 👁️':'Hidden 👁️') : (LANG==='ar'?'ظاهر ✓':'Visible ✓')}
      </button>
    </div>`;
  });
  html += '</div>';
  $('adminContent').innerHTML = html;
}

async function toggleHideTab(tabId) {
  const idx = HIDDEN_TABS.indexOf(tabId);
  if (idx >= 0) HIDDEN_TABS.splice(idx, 1);
  else HIDDEN_TABS.push(tabId);
  const r = await call('adminSetHiddenTabs', ADMIN_PIN, HIDDEN_TABS);
  if (!r.ok) return toast(r.msg, true);
  applyHiddenTabs();
  adminHideTabsUI();
}



async function adminVisibilityUI(){
  $('adminContent').innerHTML='<div class="skeleton"></div>';
  const r=await call('adminGetPredVisibility',ADMIN_PIN);
  if(!r.ok){$('adminContent').innerHTML=`<p class="muted">${esc(r.msg)}</p>`;return;}
  const mode=r.mode||'anon';
  const opts=[
    {v:'hidden', en:'🔒 Hide all predictions', ar:'🔒 إخفاء كل التوقعات', enSub:'Players see only the odds bars, no individual picks', arSub:'يرى اللاعبون النسب فقط دون التوقعات الفردية'},
    {v:'anon',   en:'👥 Show predictions (anonymous)', ar:'👥 عرض التوقعات (مجهولة)', enSub:'Everyone sees all picks but not who made them', arSub:'يرى الجميع كل التوقعات دون معرفة أصحابها'},
    {v:'named',  en:'🏷️ Show predictions with names', ar:'🏷️ عرض التوقعات بالأسماء', enSub:'Everyone sees who predicted what', arSub:'يرى الجميع من توقّع ماذا'}
  ];
  let html=`<div class="card soft"><h3>${LANG==='ar'?'ظهور التوقعات في صفحة النسب':'Prediction Visibility (Odds page)'}</h3><p class="muted" style="margin:4px 0 14px;font-size:13px">${LANG==='ar'?'تحكّم بما يراه اللاعبون في قائمة التوقعات بكل مباراة':'Controls what players see in the predictions dropdown on each match.'}</p><div style="display:flex;flex-direction:column;gap:10px">`;
  opts.forEach(o=>{
    const active=mode===o.v;
    html+=`<button onclick="setPredVis('${o.v}')" class="${active?'primary':'ghost'}" style="text-align:start;padding:12px 14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start"><span style="font-weight:700;font-size:14px">${LANG==='ar'?o.ar:o.en}${active?' ✓':''}</span><span style="font-size:12px;opacity:.75">${LANG==='ar'?o.arSub:o.enSub}</span></button>`;
  });
  html+='</div></div>';
  $('adminContent').innerHTML=html;
}
async function setPredVis(mode){
  const r=await call('adminSetPredVisibility',ADMIN_PIN,mode);
  if(!r.ok)return toast(r.msg,true);
  toast('✓');
  adminVisibilityUI();
}

async function adminBets(){$('adminContent').innerHTML='<div class="skeleton"></div>';const r=await call('adminGetBets',ADMIN_PIN);if(!r.ok){$('adminContent').innerHTML=`<p class="muted">${esc(r.msg)}</p>`;return;}const bets=r.bets||[];if(!bets.length){$('adminContent').innerHTML=`<p class="muted">${tr('noBets')}</p>`;return;}let html=`<div class="tableWrap"><table><thead><tr><th>${tr('player')}</th><th>#</th><th>${tr('team')}</th><th>${tr('betAmount')}</th><th>Status</th><th>Net</th><th></th></tr></thead><tbody>`;bets.forEach(b=>{const teamName=b.team==='H'?b.h:b.a,tagCls=!b.settled?'pending':b.payout>=b.amount?'won':'lost',netStr=b.net!==null?(b.net>=0?'+'+b.net:String(b.net)):'—';html+=`<tr><td>${esc(b.playerName)}</td><td>#${b.matchNo}</td><td>${esc(teamName)}</td><td>${b.amount}</td><td><span class="betTag ${tagCls}">${b.settled?(b.payout>=b.amount?tr('betWon'):tr('betLost')):tr('betPending')}</span></td><td>${netStr}</td><td>${!b.settled?`<button class="ghost" onclick="adminManualSettle(${b.matchNo})">Settle</button>`:''}</td></tr>`;});$('adminContent').innerHTML=html+'</tbody></table></div>';}
async function adminManualSettle(matchNo){const r=await call('adminSettleBet',ADMIN_PIN,0,matchNo);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
