        html+=`<tr${b.mismatch?' style="background:rgba(232,80,80,.12)"':''}>
          <td>${esc(b.playerName)}</td>
          <td>${esc(tn)}${b.mismatch?`<div class="tiny" style="color:var(--bad)">⚠️ ${ar?'التوقع الحالي':'now predicts'}: ${esc(predName)}</div>`:''}</td>
          <td>${b.amount}</td>
          <td><span class="betTag ${tag}">${b.settled?(b.payout>=b.amount?tr('betWon'):tr('betLost')):tr('betPending')}</span></td>
          <td>${net}</td>
          <td>
            <div class="row" style="gap:4px;flex-wrap:wrap">
              <button class="ghost danger" style="font-size:11px" onclick="adminForceCancel(${b.playerId},${no})">${ar?'إلغاء قسري':'Force Cancel'}</button>
              <input id="po_${b.playerId}_${no}" type="number" style="width:60px;font-size:11px" placeholder="${ar?'مكافأة':'Payout'}" value="${b.payout||''}">
              <button class="ghost" style="font-size:11px" onclick="adminSetPayout(${b.playerId},${no})">${ar?'تعيين':'Set'}</button>
            </div>
          </td>
        </tr>`;
      });
      html+=`</tbody></table></div>
        <div class="row" style="margin-top:6px;gap:6px">
          <button class="ghost" onclick="adminManualSettle(${no})">${ar?'تسوية':'Settle'} #${no}</button>
          <button class="ghost danger" onclick="adminManualUnsettle(${no})">${ar?'إلغاء التسوية':'Unsettle'} #${no}</button>
        </div>
      </div>`;
    });
  }
  // Place bet for player section
  const players=STATE.players||[];
  const matches=(STATE.matches||[]).filter(m=>m.no>=89);
  html+=`<div class="card soft" style="margin-top:16px">
    <b>${ar?'وضع رهان لأحد اللاعبين':'Place Bet for Player'}</b>
    <div class="row section" style="flex-wrap:wrap;gap:8px">
      <select id="abPlayer">${players.map(p=>`<option value="${p.id}">${p.id}. ${esc(p.name)}</option>`).join('')}</select>
      <select id="abMatch">${matches.map(m=>`<option value="${m.no}">#${m.no} ${esc(m.h)} vs ${esc(m.a)}</option>`).join('')}</select>
      <select id="abTeam"><option value="H">${ar?'الفريق الأول':'Home'}</option><option value="A">${ar?'الفريق الثاني':'Away'}</option></select>
      <input id="abAmount" type="number" placeholder="${ar?'المبلغ':'Amount'}" style="width:80px">
      <button class="primary" onclick="adminDoPlaceBet()">${ar?'وضع رهان':'Place Bet'}</button>
    </div>
  </div>`;
  $('adminContent').innerHTML=html;
}
async function adminForceCancel(playerId,matchNo){if(!confirm((LANG==='ar'?'إلغاء رهان اللاعب #':'Force cancel bet for player #')+playerId+' on match #'+matchNo+'?'))return;const r=await call('adminForceCancelBet',ADMIN_PIN,playerId,matchNo);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
async function adminSetPayout(playerId,matchNo){const v=Number($('po_'+playerId+'_'+matchNo)?.value);if(isNaN(v))return toast('Enter a number',true);const r=await call('adminSetBetPayout',ADMIN_PIN,playerId,matchNo,v);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
async function adminDoPlaceBet(){const pid=$('abPlayer').value,mn=$('abMatch').value,team=$('abTeam').value,amt=Number($('abAmount').value);if(!amt||amt<1)return toast(LANG==='ar'?'أدخل مبلغاً':'Enter an amount',true);const r=await call('adminPlaceBet',ADMIN_PIN,pid,mn,team,amt);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
async function adminManualSettle(matchNo){const r=await call('adminSettleBet',ADMIN_PIN,0,matchNo);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
async function adminManualUnsettle(matchNo){if(!confirm((LANG==='ar'?'إعادة كل رهانات المباراة #':'Reset all bets on match #')+matchNo+(LANG==='ar'?' إلى معلق؟':' back to pending?')))return;const r=await call('adminUnsettleBet',ADMIN_PIN,matchNo);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}

// Apply the Final showcase consistently after any Predictions, Odds, or
// Betting re-render without duplicating the three card renderers.
function decorateFinalCards(){
  ['matches','oddsBox','bettingBox'].forEach(id=>{
    const root=$(id);if(!root)return;
    root.querySelectorAll('.card').forEach(card=>{
      const badges=Array.from(card.querySelectorAll('.pill'));
      const isFinal=badges.some(p=>String(p.textContent||'').trim()==='#104');
      card.classList.toggle('finalCard',isFinal);
      if(isFinal)card.dataset.finalLabel=LANG==='ar'?'🏆 النهائي':'🏆 THE FINAL';
    });
  });
}
const finalCardObserver=new MutationObserver(decorateFinalCards);
['matches','oddsBox','bettingBox'].forEach(id=>{const el=$(id);if(el)finalCardObserver.observe(el,{childList:true,subtree:true});});

applyTheme(THEME);
applyLang();init();
setInterval(checkAppVersion,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAppVersion();});
// Silent live refresh — fires every minute, only does work when a live match is
// detected. Uses the lightweight getLive endpoint (live scores + results only,
// no spreadsheet work server-side) instead of a full getState, so many clients
// polling during a match no longer queue up behind Apps Script's limits.
setInterval(async()=>{
  if(!STATE||DIRTY||SAVING)return;
  const hasLive=STATE.liveScores&&Object.keys(STATE.liveScores).length>0;
  if(!hasLive)return;
  const r=await call('getLive');
  if(!r||!r.ok||!r.results)return;
  noteAppVersion(r.v);
  STATE.results=r.results; STATE.resultTimes=r.resultTimes||STATE.resultTimes||{}; STATE.liveScores=r.liveScores||{};
  if(ACTIVE==='pred')renderMatches();
  if(ACTIVE==='bracket')renderBracket();
},60*1000);
setInterval(()=>{if(!STATE||ACTIVE!=='pred')return;if(DIRTY||SAVING)return;let ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#matches'))return;renderMatches();refreshKoWarns()},60000);
// Keep the six-hour result window accurate while a tab remains open.
setInterval(()=>{if(!STATE||ACTIVE!=='betting')return;let ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#bettingBox'))return;renderBetting();},60000);
setInterval(()=>{if(!STATE||ACTIVE!=='odds'||ODDS_SHOW_COMPLETED)return;loadOdds(false);},5*60*1000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
