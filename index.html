<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>WC '26 Prediction League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       WC '26 PREDICTION LEAGUE — STADIUM SCOREBOARD THEME
       Palette: Pitch green · Trophy gold · Match card white
       Type: Barlow Condensed (scores/headings) + Barlow (body)
    ═══════════════════════════════════════════════════════ */
    :root {
      /* Surfaces */
      --bg:       #0B1F12;   /* deep pitch green */
      --bg2:      #0E2616;   /* slightly lighter pitch */
      --panel:    #122B19;   /* card background */
      --panel2:   #163220;   /* elevated card */
      --glass:    rgba(18,43,25,.88);

      /* Type */
      --text:     #F0EDE6;   /* warm white */
      --muted:    #7A9E82;   /* sage green */
      --dim:      #4A7255;   /* very muted */

      /* Accent — trophy gold */
      --gold:     #D4A520;
      --gold2:    #F0C842;
      --gold-glow:rgba(212,165,32,.20);
      --gold-line:rgba(212,165,32,.30);

      /* Semantic */
      --good:     #52C97A;   /* correct pick */
      --warn:     #E8A020;   /* locked / warning */
      --bad:      #E85050;   /* wrong */
      --done:     #4AB8C8;   /* completed match */

      /* Lines & shadows */
      --line:     rgba(255,255,255,.09);
      --line2:    rgba(255,255,255,.05);
      --shadow:   0 8px 32px rgba(0,0,0,.45);
      --shadow-sm:0 2px 8px rgba(0,0,0,.30);

      /* Radii */
      --r:        16px;
      --r2:       10px;
      --r-pill:   999px;

      /* Focus */
      --focus:    0 0 0 3px rgba(212,165,32,.35);

      /* Fonts */
      --font-display: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif;
      --font-body:    'Barlow', ui-sans-serif, system-ui, sans-serif;
      --font-score:   'Barlow Condensed', monospace;
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh;
      font-family: var(--font-body);
      font-size: 15px; line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(212,165,32,.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 0% 50%, rgba(20,60,30,.6) 0%, transparent 50%);
      background-attachment: fixed;
    }
    body[dir=rtl] {
      font-family: 'Noto Sans Arabic', 'Barlow', ui-sans-serif, system-ui, sans-serif;
    }
    h1,h2,h3,h4 {
      font-family: var(--font-display);
      font-weight: 700; letter-spacing: .01em;
      margin: 0;
    }
    .hidden  { display: none !important; }
    .muted   { color: var(--muted); }
    .tiny    { font-size: 12px; color: var(--muted); }
    .dim     { color: var(--dim); }

    /* ── Layout shell ── */
    .appShell { max-width: 1280px; margin: auto; padding: 0 16px 48px; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: rgba(11,31,18,.92);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--line);
    }
    .topInner {
      max-width: 1280px; margin: auto;
      padding: 12px 16px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; font-size: 22px; font-weight: 900;
      box-shadow: 0 0 0 1px var(--gold-line), 0 6px 20px var(--gold-glow);
    }
    h1 { font-size: 20px; line-height: 1.1; letter-spacing: .02em; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-body); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Tab nav ── */
    .nav {
      position: sticky; top: 69px; z-index: 55;
      padding: 10px 0 6px;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
    }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: rgba(18,43,25,.7);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: var(--r-pill);
      font-family: var(--font-display);
      font-weight: 600; font-size: 14px; letter-spacing: .03em;
      cursor: pointer; transition: all .14s;
    }
    .tab:hover { color: var(--text); border-color: var(--gold-line); }
    .tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; border-color: transparent; font-weight: 900;
      box-shadow: 0 2px 12px var(--gold-glow);
    }
    .tab:focus-visible { box-shadow: var(--focus); outline: none; }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card.soft {
      background: rgba(18,43,25,.55);
      box-shadow: none;
      border-color: var(--line2);
    }

    /* ── Layout helpers ── */
    .hero   { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; margin: 14px 0; }
    .grid   { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .row    { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .section{ margin-top: 14px; }
    .wide   { width: 100%; }

    /* ── Buttons, inputs, selects ── */
    button, input, select {
      border-radius: var(--r2);
      border: 1px solid var(--line);
      background: rgba(11,25,16,.80);
      color: var(--text);
      padding: 10px 13px;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    input:focus, select:focus, button:focus-visible {
      box-shadow: var(--focus);
      border-color: var(--gold-line);
    }
    button {
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 700; font-size: 14px; letter-spacing: .03em;
      transition: all .14s; min-height: 40px;
    }
    button:hover  { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12;
      box-shadow: 0 2px 10px var(--gold-glow);
    }
    button.primary:hover { box-shadow: 0 4px 18px var(--gold-glow); }
    .ghost  { background: rgba(255,255,255,.04); }
    .danger { border-color: rgba(232,80,80,.5); color: #ffcaca; }
    label   { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-family: var(--font-body); }

    /* ── Pills & badges ── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line);
      background: rgba(11,25,16,.80);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      color: var(--muted); font-size: 12px;
      font-family: var(--font-body);
    }
    .saveBadge {
      font-size: 12px; padding: 5px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      background: rgba(11,25,16,.85);
      font-family: var(--font-body);
    }
    .saveBadge.good { color: var(--good); border-color: rgba(82,201,122,.30); }
    .saveBadge.warn { color: var(--warn); border-color: rgba(232,160,32,.30); }
    .saveBadge.bad  { color: var(--bad);  border-color: rgba(232,80,80,.30);  }
    .warnTag  { border-color: rgba(232,160,32,.40); color: var(--warn); background: rgba(232,160,32,.08); }
    .koWarn   { animation: pulse-warn .9s ease-in-out infinite alternate; }
    @keyframes pulse-warn { to { border-color: var(--warn); } }

    /* ── Filter bar ── */
    .filters {
      display: flex; gap: 6px; overflow-x: auto;
      margin: 12px 0; scrollbar-width: none; padding-bottom: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter { white-space: nowrap; padding: 7px 12px; min-height: 34px; font-size: 13px; }
    .filter.groupFilter { min-width: 36px; justify-content: center; padding: 7px 8px; }
    .filter.active { background: rgba(212,165,32,.12); border-color: var(--gold-line); color: var(--gold2); }
    .searchBox { min-width: 200px; flex: 1; }

    /* ── Match card ── */
    .match { padding: 0; overflow: hidden; }
    .matchHead {
      padding: 10px 14px;
      background: linear-gradient(90deg, rgba(212,165,32,.08), transparent);
      border-bottom: 1px solid var(--line2);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .matchBody { padding: 14px; }
    .matchStageLine { display: none; } /* handled by badges */

    /* Teams layout — always 3-col, never wraps */
    .teams {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: center; gap: 6px;
      margin: 10px 0;
    }
    .team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .team.away { justify-content: flex-end; flex-direction: row-reverse; }
    body[dir=rtl] .team       { flex-direction: row-reverse; }
    body[dir=rtl] .team.away  { flex-direction: row; }
    .flagImg {
      width: 26px; height: 18px; flex-shrink: 0;
      border-radius: 3px; object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      background: #1a3a22;
    }
    .flagFallback { font-size: 18px; flex-shrink: 0; }
    .teamName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .vs {
      text-align: center; color: var(--dim);
      font-family: var(--font-display); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* ── SCOREBOARD score inputs — the signature element ── */
    .scorebox {
      display: flex; align-items: center;
      justify-content: center; gap: 0; margin: 10px 0;
      background: #070F0A;
      border: 1px solid rgba(212,165,32,.20);
      border-radius: 10px;
      overflow: hidden;
      max-width: 200px; margin-inline: auto;
    }
    .scorebox input {
      width: 72px; flex: 1;
      text-align: center;
      font-family: var(--font-score);
      font-size: 28px; font-weight: 900;
      color: var(--gold2);
      background: transparent;
      border: none; border-radius: 0;
      padding: 10px 4px;
      letter-spacing: .04em;
      -moz-appearance: textfield;
    }
    .scorebox input::-webkit-inner-spin-button,
    .scorebox input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scorebox input:focus { box-shadow: none; border: none; background: rgba(212,165,32,.06); }
    .scorebox input:disabled { color: var(--muted); }
    .scoreDash {
      width: 1px; align-self: stretch;
      background: rgba(212,165,32,.20);
      flex-shrink: 0;
    }

    /* KO box */
    .koBox {
      margin-top: 8px; padding: 10px;
      border-radius: var(--r2);
      background: rgba(212,165,32,.03);
      border: 1px dashed rgba(212,165,32,.15);
    }

    /* match locked state */
    .match.locked .matchHead {
      background: linear-gradient(90deg, rgba(255,255,255,.025), transparent);
    }
    .match.locked .scorebox { border-color: var(--line); }
    .match.locked .scorebox input { color: var(--muted); }

    /* ── Status pills ── */
    .matchBadges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .groupBadge {
      width: 32px; height: 26px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px; font-family: var(--font-display);
      font-size: 14px; font-weight: 900; color: #0B1F12; border: none;
      box-shadow: var(--shadow-sm);
    }
    .groupBadge span { font-size: 9px; margin-inline-end: 1px; opacity: .7; }
    .group-a{background:#7DD3FC}.group-b{background:#FCA5A5}.group-c{background:#86EFAC}
    .group-d{background:#FCD34D}.group-e{background:#C4B5FD}.group-f{background:#67E8F9}
    .group-g{background:#6EE7B7}.group-h{background:#F9A8D4}.group-i{background:#A5B4FC}
    .group-j{background:#DDB892}.group-k{background:#A7F3D0}.group-l{background:#93C5FD}

    .stageTag { background: rgba(212,165,32,.10); border-color: var(--gold-line); color: var(--gold2); font-weight: 700; }
    .roundTag { background: rgba(74,184,200,.10); border-color: rgba(74,184,200,.35); color: var(--done); font-weight: 700; }
    .statusTag.open   { color: var(--good); border-color: rgba(82,201,122,.30); }
    .statusTag.locked { color: var(--warn); border-color: rgba(232,160,32,.30); background: rgba(232,160,32,.06); }
    .statusTag.done   { color: var(--done); border-color: rgba(74,184,200,.30); background: rgba(74,184,200,.06); }

    /* ── Quick stats ── */
    .quickCard { padding: 14px; }
    .quickHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .quickHead h2 { font-size: 16px; }
    .quickStats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .stat {
      padding: 12px; border-radius: 12px;
      background: rgba(11,25,16,.72); border: 1px solid var(--line2);
      min-height: 68px;
    }
    .stat b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 900; line-height: 1.05; margin-top: 4px; }
    .stat .tiny { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.main {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(212,165,32,.12), rgba(212,165,32,.04));
      border-color: var(--gold-line);
    }
    .stat.main b { font-size: 30px; color: var(--gold2); }
    .progress { height: 6px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s ease; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line2); text-align: start; vertical-align: middle; }
    th { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: rgba(11,25,16,.70); position: sticky; top: 0; }
    tr:hover td { background: rgba(212,165,32,.03); }
    .tableWrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
    .rank1 td:first-child { color: var(--gold2); font-family: var(--font-display); font-size: 18px; font-weight: 900; }

    /* ── Rules ── */
    .ruleGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; }
    .ruleTile {
      padding: 16px; border-radius: 14px;
      background: rgba(11,25,16,.72); border: 1px solid var(--line2);
    }
    .ruleTile b { display: block; margin-top: 6px; font-family: var(--font-display); font-size: 24px; font-weight: 900; color: var(--gold2); }

    /* ── Admin layout ── */
    .adminLayout { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
    .side {
      position: sticky; top: 132px;
      display: grid; gap: 4px;
      background: rgba(11,25,16,.8); border: 1px solid var(--line); border-radius: var(--r); padding: 10px;
    }
    .side button { text-align: start; justify-content: flex-start; border-color: transparent; background: transparent; }
    .side button:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
    .side button.active {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0B1F12; border-color: transparent;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; z-index: 100; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel2); border: 1px solid var(--line);
      box-shadow: var(--shadow); border-radius: var(--r);
      padding: 12px 18px; max-width: min(92vw, 480px);
      font-family: var(--font-body); font-size: 14px;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(10px); } }
    .toast.err { border-color: rgba(232,80,80,.50); color: #ffcaca; }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: var(--r); min-height: 130px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Group standings ── */
    .standingsGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px,1fr)); gap: 12px; }
    .groupTitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .groupTitle h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
    .groupMeta { font-size: 11px; color: var(--muted); }
    .groupLetterBig { width: 40px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 900; color: #0B1F12; flex-shrink: 0; }
    .rankCell { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
    .standingsTable { min-width: 320px; }
    .standingsTable td, .standingsTable th { padding: 8px 6px; }
    .flagFallback { display: none; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .adminLayout { grid-template-columns: 1fr; }
      .quickStats { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .stat.main { grid-column: span 1; }
      .stat b { font-size: 18px; }
      .stat.main b { font-size: 22px; }
      .topInner { align-items: flex-start; padding: 10px 14px; }
      .side { position: static; display: flex; overflow-x: auto; flex-wrap: nowrap; }
      .side button { white-space: nowrap; }
      .appShell { padding-inline: 12px; }
      .card { padding: 14px; border-radius: 14px; }
      .nav { top: 68px; }
      .logo { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
      h1 { font-size: 17px; }
      .standingsGrid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .quickStats { grid-template-columns: 1fr 1fr; }
      .stat.main { grid-column: span 2; }
      .playerHeroText { display: none; }
      .grid { grid-template-columns: 1fr; }
      .teamName { font-size: 13px; }
      .scorebox input { font-size: 24px; width: 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  
    /* ══════════════════════════════════════════
       THEMES  —  applied via html[data-theme]
       Default (no attr) = Pitch Green (current)
    ══════════════════════════════════════════ */

    /* ── Night Sky (deep navy + electric violet) ── */
    html[data-theme="night"] {
      --bg:        #0A0D1A;
      --bg2:       #0D1120;
      --panel:     #111727;
      --panel2:    #151D30;
      --text:      #E8EEFF;
      --muted:     #6B7DB3;
      --dim:       #3D4D7A;
      --gold:      #7C6FED;
      --gold2:     #A89CF7;
      --gold-glow: rgba(124,111,237,.22);
      --gold-line: rgba(124,111,237,.30);
      --focus:     0 0 0 3px rgba(124,111,237,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="night"] body {
      background-image:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(124,111,237,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 100% 100%, rgba(20,15,50,.8) 0%, transparent 50%);
    }

    /* ── Desert Sand (warm amber + terracotta) ── */
    html[data-theme="desert"] {
      --bg:        #1A1208;
      --bg2:       #1F1710;
      --panel:     #271B0E;
      --panel2:    #2E2012;
      --text:      #F5EDD8;
      --muted:     #9A8060;
      --dim:       #5C4A2A;
      --gold:      #E07820;
      --gold2:     #F5A040;
      --gold-glow: rgba(224,120,32,.22);
      --gold-line: rgba(224,120,32,.32);
      --focus:     0 0 0 3px rgba(224,120,32,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="desert"] body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(224,120,32,.10) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 0% 80%, rgba(40,20,5,.7) 0%, transparent 50%);
    }

    /* ── Ice (silver + cyan, light mode) ── */
    html[data-theme="ice"] {
      --bg:        #EEF2F7;
      --bg2:       #E4EAF2;
      --panel:     #FFFFFF;
      --panel2:    #F8FAFC;
      --text:      #0F1E2E;
      --muted:     #5A7898;
      --dim:       #94AEC4;
      --gold:      #0078C8;
      --gold2:     #1A9AE8;
      --gold-glow: rgba(0,120,200,.15);
      --gold-line: rgba(0,120,200,.25);
      --focus:     0 0 0 3px rgba(0,120,200,.25);
      --line:      rgba(0,0,0,.10);
      --line2:     rgba(0,0,0,.06);
      --shadow:    0 4px 20px rgba(0,0,0,.10);
      --shadow-sm: 0 1px 4px rgba(0,0,0,.08);
      --good:      #18A060;
      --warn:      #D07000;
      --bad:       #C83030;
    }
    html[data-theme="ice"] body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,120,200,.07) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 100% 100%, rgba(200,230,255,.5) 0%, transparent 50%);
    }
    html[data-theme="ice"] button, html[data-theme="ice"] input, html[data-theme="ice"] select {
      background: #FFFFFF;
    }
    html[data-theme="ice"] .ghost { background: rgba(0,0,0,.05); }
    html[data-theme="ice"] .tab   { background: rgba(0,0,0,.04); }
    html[data-theme="ice"] .card  { background: #FFFFFF; }
    html[data-theme="ice"] .card.soft { background: rgba(0,0,0,.03); }
    html[data-theme="ice"] .scorebox { background: #0D1E2E; }
    html[data-theme="ice"] .scorebox input { background: transparent; }
    html[data-theme="ice"] .topbar { background: rgba(238,242,247,.92); }
    html[data-theme="ice"] .pill   { background: rgba(0,0,0,.04); }
    html[data-theme="ice"] .stat   { background: rgba(0,0,0,.04); }
    html[data-theme="ice"] .side   { background: rgba(0,0,0,.04); }
    html[data-theme="ice"] .nav    { background: linear-gradient(180deg,#EEF2F7 60%,transparent); }

    /* ── Midnight Red (dark charcoal + crimson) ── */
    html[data-theme="red"] {
      --bg:        #110A0A;
      --bg2:       #160D0D;
      --panel:     #1C1010;
      --panel2:    #211414;
      --text:      #F5EAEA;
      --muted:     #9A7070;
      --dim:       #5C3A3A;
      --gold:      #CC2020;
      --gold2:     #E84040;
      --gold-glow: rgba(204,32,32,.22);
      --gold-line: rgba(204,32,32,.32);
      --focus:     0 0 0 3px rgba(204,32,32,.30);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
      --good:      #52C97A;
      --warn:      #E8A020;
      --bad:       #E85050;
    }
    html[data-theme="red"] body {
      background-image:
        radial-gradient(ellipse 70% 35% at 50% -8%, rgba(204,32,32,.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 60% at 100% 50%, rgba(30,5,5,.7) 0%, transparent 50%);
    }
  
    /* ── Match card result colour-coding ── */
    .match.res-exact  { border-color: rgba(82,201,122,.55);  box-shadow: 0 0 0 1px rgba(82,201,122,.20),  var(--shadow); }
    .match.res-outcome{ border-color: rgba(212,165,32,.45);  box-shadow: 0 0 0 1px rgba(212,165,32,.15),  var(--shadow); }
    .match.res-wrong  { border-color: rgba(232,80,80,.45);   box-shadow: 0 0 0 1px rgba(232,80,80,.15),   var(--shadow); }
    .match.res-exact  .matchHead { background: linear-gradient(90deg,rgba(82,201,122,.10),transparent); }
    .match.res-outcome .matchHead{ background: linear-gradient(90deg,rgba(212,165,32,.10),transparent); }
    .match.res-wrong  .matchHead { background: linear-gradient(90deg,rgba(232,80,80,.10),transparent);  }
    .resultBadge { font-family: var(--font-display); font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill); }
    .resultBadge.exact   { color: var(--good); background: rgba(82,201,122,.12);  border: 1px solid rgba(82,201,122,.30); }
    .resultBadge.outcome { color: var(--gold2);background: rgba(212,165,32,.10);  border: 1px solid rgba(212,165,32,.25); }
    .resultBadge.wrong   { color: var(--bad);  background: rgba(232,80,80,.10);   border: 1px solid rgba(232,80,80,.25);  }
    .resultBadge.nopred  { color: var(--muted);background: transparent; border: 1px solid var(--line2); }
    .resultScore { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing:.02em; }

    /* ── Group standings ── */
    .standingsGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(340px,1fr)); gap: 12px; }
    .groupTitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .groupTitle h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
    .groupMeta { font-size: 11px; color: var(--muted); }
    .groupLetterBig { width: 40px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 900; color: #0B1F12; flex-shrink: 0; }
    .rankCell { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
    .standingsTable { min-width: 300px; }
    .standingsTable td,.standingsTable th { padding: 8px 6px; font-size: 13px; }
    .qualified-1 td:first-child { color: var(--good); }
    .qualified-2 td:first-child { color: var(--gold2); }

    /* ── Admin matrix ── */
    .matrixWrap { overflow: auto; max-height: 75vh; }
    .matrixTable { border-collapse: collapse; min-width: 900px; }
    .matrixTable th,.matrixTable td { padding: 6px 8px; border: 1px solid var(--line2); text-align: center; font-size: 12px; white-space: nowrap; }
    .matrixTable th { background: rgba(11,25,16,.80); font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing:.04em; position: sticky; top: 0; z-index: 2; }
    .matrixTable th.stickyCol { left: 0; z-index: 3; }
    .matrixTable td.stickyCol { position: sticky; left: 0; background: var(--panel); font-weight: 600; font-size: 13px; text-align: start; padding-inline: 10px; }
    .matrixTable td.mxExact   { background: rgba(82,201,122,.18);  color: var(--good); font-weight: 700; }
    .matrixTable td.mxOutcome { background: rgba(212,165,32,.14);  color: var(--gold2);font-weight: 700; }
    .matrixTable td.mxWrong   { background: rgba(232,80,80,.14);   color: var(--bad);  font-weight: 700; }
    .matrixTable td.mxNone    { color: var(--dim); }
    .matrixTable td.mxTotal   { background: var(--panel2); font-family: var(--font-display); font-size: 15px; font-weight: 900; position: sticky; right: 0; }

  
    .betBox{margin-top:10px;padding:10px;border-radius:var(--r2);background:rgba(212,165,32,.04);border:1px solid rgba(212,165,32,.18)}
    .betBox.hasBet{background:rgba(82,201,122,.05);border-color:rgba(82,201,122,.25)}
    .betOddsBar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:6px 0;background:var(--line2)}
    .betOddsH{background:var(--gold);height:100%;transition:width .4s}
    .betOddsA{background:var(--done);height:100%;transition:width .4s}
    .betTag{font-family:var(--font-display);font-size:12px;font-weight:700;padding:3px 8px;border-radius:var(--r-pill)}
    .betTag.won{color:var(--good);background:rgba(82,201,122,.12);border:1px solid rgba(82,201,122,.30)}
    .betTag.lost{color:var(--bad);background:rgba(232,80,80,.12);border:1px solid rgba(232,80,80,.25)}
    .betTag.pending{color:var(--muted);background:transparent;border:1px solid var(--line2)}
    .balancePill{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--gold2);background:rgba(212,165,32,.10);border:1px solid rgba(212,165,32,.25);padding:4px 10px;border-radius:var(--r-pill)}

  </style>
</head>

  const submitted=matches.filter(m=>hasPick(mine[m.no]||mine[String(m.no)])).length;
  const remainingOpen=matches.filter(m=>!results[m.no]&&!locked(m)&&!hasPick(mine[m.no]||mine[String(m.no)])).length;
  const pct=total?Math.round(submitted/total*100):0;
  el.innerHTML=
    statTile(quickLabel('Predicted','تم توقعها'), `${submitted}/${total}`, `${pct}%`, true)+
    statTile(quickLabel('Need picks','الناقص'), remainingOpen, quickLabel('open games','مباريات متاحة'))+
    statTile(quickLabel('Points','النقاط'), '—', quickLabel('loading','جاري التحميل'));

function _scoreOnClient(pred, result, matchNo, stage) {
  // Mirrors server _scoreOne but client-side for card display
  if (!pred || !result) return null;
  const ko = matchNo >= 73;
  const hg = Number(pred.hg), ag = Number(pred.ag);
  if (isNaN(hg) || isNaN(ag)) return null;
  const rhg = Number(result.hg), rag = Number(result.ag);
  const scoreExact = hg === rhg && ag === rag;
  const predW = hg > ag ? 'H' : ag > hg ? 'A' : (pred.w || 'D');
  const resW  = rhg > rag ? 'H' : rag > rhg ? 'A' : (result.w || 'D');
  const correctQ = resW !== 'D' && predW === resW;
  if (!ko) {
    if (scoreExact) return {cls:'exact',   pts: 2};
    if (predW === resW) return {cls:'outcome', pts: 1};
    return {cls:'wrong', pts: 0};
  }
  const vals = matchNo>=101&&matchNo<=104 ? {e:32,o:16,w:-16} :
               matchNo===103             ? {e:16,o:8, w:-8}  :
               matchNo>=97&&matchNo<=100 ? {e:8, o:4, w:-4}  :
               {e:4, o:2, w:-2};
  if (!correctQ) return {cls:'wrong',   pts: vals.w};
  if (result.pen) {
    const penEx = scoreExact && pred.pen && pred.w === result.w;
    return penEx ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
  }
  return scoreExact ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
}

function renderGroups(){
  if(!$('groupsBox')||!STATE)return;

  // Group tab only: FIFA-style standings.
  // Win = 3 points, Draw = 1 point, Loss = 0 points.
  // Goals For and Goals Against are counted for every team.
  let liveRosters={};
  (STATE.matches||[]).forEach(m=>{let g=getGroup(m);if(!g)return;liveRosters[g]=liveRosters[g]||new Set();if(m.h&&m.h!=='TBD')liveRosters[g].add(m.h);if(m.a&&m.a!=='TBD')liveRosters[g].add(m.a);});
  let groups={};
  'ABCDEFGHIJKL'.split('').forEach(g=>{groups[g]={};let list=(liveRosters[g]&&liveRosters[g].size===4)?Array.from(liveRosters[g]):(GROUP_ROSTERS[g]||[]);list.forEach(t=>{groups[g][t]={team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});});

  (STATE.matches||[]).forEach(m=>{
    let g=getGroup(m);
    if(!g || !groups[g])return;
    let r=STATE.results&&STATE.results[m.no];
    if(!r)return;

    let home=groups[g][m.h], away=groups[g][m.a];
    if(!home||!away)return;

    let hg=Number(r.hg), ag=Number(r.ag);
    if(isNaN(hg)||isNaN(ag))return;

    home.P++; away.P++;
    home.GF+=hg; home.GA+=ag;
    away.GF+=ag; away.GA+=hg;

    if(hg>ag){home.W++; away.L++; home.Pts+=3;}
    else if(ag>hg){away.W++; home.L++; away.Pts+=3;}
    else {home.D++; away.D++; home.Pts+=1; away.Pts+=1;}

    home.GD=home.GF-home.GA;
    away.GD=away.GF-away.GA;
  });

  let letters='ABCDEFGHIJKL'.split('');
  let html='<div class="standingsGrid">';
  letters.forEach(g=>{
    let teams=Object.values(groups[g]||{}).sort((a,b)=>
      b.Pts-a.Pts || b.GD-a.GD || b.GF-a.GF || a.team.localeCompare(b.team)
    );
    let completed=teams.reduce((s,t)=>s+t.P,0)/2 || 0;
    html+=`<div class="card soft"><div class="groupTitle">${groupBadgeHtml(g,true)}<div><h3>${esc(tr('group'))} ${g}</h3><div class="groupMeta">${completed} ${LANG==='ar'?'مباريات مكتملة':'completed matches'} · ${LANG==='ar'?'الفوز ٣ نقاط، التعادل نقطة':'Win 3 pts, draw 1 pt'}</div></div></div>`;
    html+=`<div class="tableWrap"><table class="standingsTable"><thead><tr><th>#</th><th>${tr('team')}</th><th title="Played">P</th><th title="Wins">W</th><th title="Draws">D</th><th title="Losses">L</th><th title="Goals for">GF</th><th title="Goals against">GA</th><th title="Goal difference">GD</th><th title="Points">Pts</th></tr></thead><tbody>`;
    teams.forEach((t,i)=>{
      const qCls=i===0?'qualified-1':i===1?'qualified-2':'';
      html+=`<tr class="${qCls}"><td class="rankCell">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${teamHtml(t.team)}</td><td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td><td>${t.GF}</td><td>${t.GA}</td><td>${t.GD>0?'+'+t.GD:t.GD}</td><td><b>${t.Pts}</b></td></tr>`;
    });
    html+='</tbody></table></div></div>';
  });
  $('groupsBox').innerHTML=html+'</div>';
}

function adminResults(){adminChampionResult();let html='<p class="muted">'+tr('resultsHelp')+'</p><div class="grid">'+STATE.matches.map(m=>{let r=(STATE.results||{})[m.no]||{},ko=isKO(m);return `<div class="card soft"><div><b>#${m.no}</b> ${teamHtml(m.h)} <span class="vs">VS</span> ${teamHtml(m.a)}</div><div class="scorebox"><input data-res="${m.no}" data-k="hg" type="number" value="${r.hg??''}"><span class="scoreDash"></span><input data-res="${m.no}" data-k="ag" type="number" value="${r.ag??''}"></div>${ko?`<div class="koBox row"><label class="pill"><input data-res="${m.no}" data-k="pen" type="checkbox" ${r.pen?'checked':''}> ${tr('penalties')}</label><select data-res="${m.no}" data-k="w"><option value="">${tr('winner')}</option><option value="H" ${r.w==='H'?'selected':''}>${esc(m.h)}</option><option value="A" ${r.w==='A'?'selected':''}>${esc(m.a)}</option></select>${r.hg!=null&&r.ag!=null&&Number(r.hg)===Number(r.ag)&&!r.w?`<span class='pill warnTag'>${LANG==='ar'?'حدد المتأهل':'Winner required'}</span>`:''}</div>`:''}
${(STATE.results&&STATE.results[m.no])?`<button class='ghost danger' style='margin-top:6px;width:100%' onclick='deleteResult(${m.no})'>${tr('deleteResult')} #${m.no}</button>`:''}</div>`}).join('')+'</div><div class="section"><button class="primary" onclick="saveResults()">'+tr('saveResults')+'</button></div>';$('adminContent').innerHTML=html}function adminChampionResult(){
  const allTeams=['Mexico','South Africa','South Korea','Czechia','Canada','Bosnia and Herzegovina','Qatar','Switzerland','Brazil','Morocco','Haiti','Scotland','United States','Paraguay','Australia','Türkiye','Germany','Curaçao',"Côte d'Ivoire",'Ecuador','Netherlands','Japan','Sweden','Tunisia','Belgium','Egypt','IR Iran','New Zealand','Spain','Cabo Verde','Saudi Arabia','Uruguay','France','Senegal','Iraq','Norway','Argentina','Algeria','Austria','Jordan','Portugal','Congo DR','Uzbekistan','Colombia','England','Croatia','Ghana','Panama'].sort();
  const current=(STATE.champion&&STATE.champion.winner)||'';
  const sel=`<select id="champWinnerSelect"><option value="">— ${tr('championWinner')} —</option>${allTeams.map(t=>`<option value="${esc(t)}" ${current===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  const existing=$('adminContent').innerHTML;
  $('adminContent').innerHTML=`<div class="card soft" style="margin-bottom:12px"><h3>${tr('championTitle')}</h3><div class="row" style="margin-top:8px">${sel}<button class="primary" onclick="saveChampWinner()">${tr('setChampionWinner')}</button></div>${current?`<p class="tiny">${LANG==='ar'?'البطل الحالي':'Current winner'}: <b>${esc(current)}</b></p>`:''}</div>`+existing;
}

async function adminPredictions(){let r=await call('adminGetAllPredictions',ADMIN_PIN);if(!r.ok){$('adminContent').innerHTML='<p class="muted">'+esc(r.msg)+'</p>';return}$('adminContent').innerHTML=`<div class="row"><select id="predPlayerSelect">${r.players.map(p=>`<option value="${p.id}">${p.id}. ${esc(p.name)}</option>`).join('')}</select><button class="primary" onclick="loadAdminPlayerPredictions()">${tr('viewPredictions')}</button></div><div id="playerPredictionsBox" class="section"></div>`;loadAdminPlayerPredictions()}function predText(p,m){if(!p)return tr('noPrediction');let s=`${p.hg} - ${p.ag}`;if(m.isKO){if(p.pen)s+=` · ${tr('penalties')}`;if(p.w)s+=` · ${tr('winner')}: ${p.w==='H'?m.h:m.a}`}return esc(s)}function resText(r,m){if(!r)return '—';let s=`${r.hg} - ${r.ag}`;if(m.isKO){if(r.pen)s+=` · ${tr('penalties')}`;if(r.w)s+=` · ${tr('winner')}: ${r.w==='H'?m.h:m.a}`}return esc(s)}async function loadAdminPlayerPredictions(){let id=$('predPlayerSelect').value;let r=await call('adminGetPredictions',ADMIN_PIN,id);if(!r.ok)return $('playerPredictionsBox').innerHTML='<p class="muted">'+esc(r.msg)+'</p>';let rows=r.rows.map(m=>`<tr><td>#${m.no}</td><td>${esc(stageLabel(m))}</td><td>${teamHtml(m.h)} VS ${teamHtml(m.a)}<div class="tiny">${localTime(m.iso)}</div></td><td>${predText(m.pred,m)}</td><td>${resText(m.result,m)}</td><td><b>${m.points==null?'—':m.points}</b></td></tr>`).join('');$('playerPredictionsBox').innerHTML=`<h3>${esc(r.player.name)}</h3><div class="tableWrap"><table><thead><tr><th>#</th><th>${tr('stage')}</th><th>${tr('matchSetup')}</th><th>${tr('prediction')}</th><th>${tr('result')}</th><th>${tr('scorePoints')}</th></tr></thead><tbody>${rows}</tbody></table></div>`}

async function adminMatrix(){
  $('adminContent').innerHTML='<div class="skeleton"></div>';
  const r=await call('adminGetFullMatrix',ADMIN_PIN);
  if(!r.ok)return $('adminContent').innerHTML='<p class="muted">'+esc(r.msg)+'</p>';
  const matches=r.matches.filter(m=>m.result); // only show completed
  if(!matches.length){$('adminContent').innerHTML='<p class="muted">'+(LANG==='ar'?'لا توجد نتائج بعد':'No results yet')+'</p>';return;}
  let html='<div class="matrixWrap"><table class="matrixTable"><thead><tr><th class="stickyCol">'+tr('player')+'</th>';
  matches.forEach(m=>{
    const stage=stageLabel(m); const short=m.h.split(' ')[0]+' v '+m.a.split(' ')[0];
    html+=`<th title="#${m.no} ${esc(stage)}: ${esc(m.h)} vs ${esc(m.a)}">#${m.no}</th>`;
  });
  html+='<th class="stickyCol">'+tr('totalPoints')+'</th></tr></thead><tbody>';
  r.players.forEach(p=>{
    html+=`<tr><td class="stickyCol">${esc(p.name)}</td>`;
    matches.forEach(m=>{
      const c=p.cells[m.no];
      if(!c){html+='<td class="mxNone">—</td>';return;}
      let cls='mxNone', pts='?';
      if(c.points!=null){pts=(c.points>0?'+':'')+c.points;}
      if(c.exact)cls='mxExact'; else if(c.outcome)cls='mxOutcome'; else if(c.wrong)cls='mxWrong';
      const predStr=c.pred?`${c.pred.hg}-${c.pred.ag}`:'?';
      html+=`<td class="${cls}" title="${esc(predStr)}">${pts}</td>`;
    });
    html+=`<td class="mxTotal">${p.total>0?'+':''}${p.total}</td></tr>`;
  });
  html+='</tbody></table></div>';
  $('adminContent').innerHTML=html;
}

async function adminSync(){let r=await call('getApiSyncStatus',ADMIN_PIN);$('adminContent').innerHTML=`<p class="muted">${tr('apiHelp')}</p><input id="apiToken" class="wide" placeholder="${tr('apiToken')}"><div class="row section"><button class="ghost" onclick="saveToken()">${tr('saveApiToken')}</button><button class="primary" onclick="syncNow()">${tr('syncNow')}</button><button class="ghost" onclick="enableSync()">${tr('enableAutoSync')}</button><button class="ghost" onclick="disableSync()">${tr('disableAutoSync')}</button></div><p id="syncMsg" class="muted">Token: ${r.hasToken?'✅':'❌'} · Auto: ${r.autoSync?'ON':'OFF'}${r.lastSyncAt?` · ${LANG==='ar'?'آخر مزامنة':'Last sync'}: ${localTime(new Date(r.lastSyncAt).toISOString())} — ${esc(r.lastSyncMsg||'')}`:''}</p>`}async function saveToken(){let r=await call('setFootballDataToken',ADMIN_PIN,$('apiToken').value.trim());if(!r.ok)return toast(r.msg,true);toast('OK');adminSync()}async function syncNow(){let r=await call('syncFootballData',ADMIN_PIN);if(!r.ok)return toast(r.msg,true);$('syncMsg').textContent=`Mapped ${r.mapped}; results ${r.updatedResults}; unmapped ${(r.unmapped||[]).length}`;toast('OK');init()}async function enableSync(){let r=await call('enableAutoSync',ADMIN_PIN);if(!r.ok)return toast(r.msg,true);toast('OK');adminSync()}async function disableSync(){let r=await call('disableAutoSync',ADMIN_PIN);if(!r.ok)return toast(r.msg,true);toast('OK');adminSync()}
function adminReset(){$('adminContent').innerHTML=`<p class="muted">This disconnects this deployment from the current data Sheet.</p><input id="resetPhrase" placeholder="${tr('typeReset')}"><button class="danger" onclick="resetLeague()">${tr('resetLeagueLink')}</button>`}async function resetLeague(){let r=await call('adminResetLeague',ADMIN_PIN,$('resetPhrase').value);if(!r.ok)return toast(r.msg,true);localStorage.clear();toast('OK');init()}

async function loadChampion(){
  if(!STATE)return;
  const box=$('championBox'); if(!box)return;
  const ch=STATE.champion||{};
  const locked=ch.locked||Date.now()>=new Date(ch.lockIso||'2026-06-19T23:59:00+03:00').getTime();
  const allTeams=['Mexico','South Africa','South Korea','Czechia','Canada','Bosnia and Herzegovina','Qatar','Switzerland','Brazil','Morocco','Haiti','Scotland','United States','Paraguay','Australia','Türkiye','Germany','Curaçao',"Côte d'Ivoire",'Ecuador','Netherlands','Japan','Sweden','Tunisia','Belgium','Egypt','IR Iran','New Zealand','Spain','Cabo Verde','Saudi Arabia','Uruguay','France','Senegal','Iraq','Norway','Argentina','Algeria','Austria','Jordan','Portugal','Congo DR','Uzbekistan','Colombia','England','Croatia','Ghana','Panama'].sort();
  const myPick=SESSION?ch.myPick||'':'';
  const winner=ch.winner||'';
  let html='';

  // Player pick card
  if(SESSION){
    html+=`<div class="card soft" style="margin-bottom:12px">
      <div class="between"><h3>${tr('championPick')}</h3>${locked?`<span class="pill statusTag locked">🔒 ${tr('championLock')}</span>`:`<span class="pill statusTag open">⏰ ${localTime(ch.lockIso)}</span>`}</div>
      <div class="row" style="margin-top:10px">
        ${locked
          ? `<span class="pill">${myPick?teamHtml(myPick):tr('championNoPick')}</span>`
          : `<select id="champSelect"><option value="">${tr('championPick')}…</option>${allTeams.map(t=>`<option value="${esc(t)}" ${myPick===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
             <button class="primary" onclick="saveChampPick()">${tr('saveChampionPick')}</button>`
        }
        ${winner&&myPick?`<span class="pill ${myPick===winner?'statusTag done':'statusTag locked'}">${myPick===winner?tr('championCorrect'):tr('championWrong')}</span>`:''}
      </div>
    </div>`;
  }

  // Leaderboard
  const _champ_tbd=`<span class="muted">TBD</span>`;html+=`<div class="card soft"><div class="between"><h3>${tr('championWinner')}: ${winner?teamHtml(winner):_champ_tbd}</h3></div>`;
  html+=`<div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>${tr('player')}</th><th>${tr('championPick')}</th><th>Pts</th></tr></thead><tbody>`;
  const picks=ch.picks||{};
  const players=(STATE.players||[]).slice().sort((a,b)=>{
    const ap=picks[a.id]||'',bp=picks[b.id]||'';
    const ac=winner&&ap===winner?1:0,bc=winner&&bp===winner?1:0;
    return bc-ac||a.name.localeCompare(b.name);
  });
  players.forEach((p,i)=>{
    const pick=picks[p.id]||'';
    const correct=winner&&pick===winner;
    html+=`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${pick?teamHtml(pick):`<span class="muted">${tr('championNoPick')}</span>`}</td><td><b>${correct?'+16':'—'}</b></td></tr>`;
  });
  html+='</tbody></table></div></div>';
  box.innerHTML=html;
}

async function saveChampPick(){
  if(!SESSION)return toast(tr('loginFirst'),true);
  const team=$('champSelect')?.value; if(!team)return toast(LANG==='ar'?'اختر فريقاً':'Choose a team',true);
  const r=await call('saveChampionPick',SESSION.id,SESSION.pin,team);
  if(!r.ok)return toast(r.msg,true);
  STATE.champion=STATE.champion||{};
  STATE.champion.myPick=r.team;
  STATE.champion.picks=STATE.champion.picks||{};
  STATE.champion.picks[SESSION.id]=r.team;
  toast('OK');
  loadChampion();
}


function betOddsHtml(pool,mh,ma){const total=pool.total||0,hPct=total?Math.round(pool.h/total*100):50,aPct=100-hPct,hOdds=pool.h>0?(total/pool.h).toFixed(2):'—',aOdds=pool.a>0?(total/pool.a).toFixed(2):'—';return `<div class="tiny" style="margin:4px 0">${tr('pool')}: <b>${total}</b> pts &nbsp;·&nbsp; ${esc(mh)} <b>${hOdds}x</b> &nbsp;·&nbsp; ${esc(ma)} <b>${aOdds}x</b></div><div class="betOddsBar"><div class="betOddsH" style="width:${hPct}%"></div><div class="betOddsA" style="width:${aPct}%"></div></div><div class="row tiny" style="justify-content:space-between;margin-top:2px"><span>${esc(mh)} ${hPct}%</span><span>${aPct}% ${esc(ma)}</span></div>`}
async function loadBetting(){const box=$('bettingBox');if(!box||!STATE)return;box.innerHTML='<div class="skeleton"></div>';const r=SESSION?await call('getBettingState',SESSION.id,SESSION.pin):await call('getBettingState',0,'');if(!r.ok){box.innerHTML=`<p class="muted">${esc(r.msg)}</p>`;return;}BETS_STATE.pools=r.pools||{};if(SESSION){BETS_STATE.myBets=r.myBets||{};BETS_STATE.balance=r.balance??null;}const balEl=$('balanceDisplay');if(balEl&&SESSION&&BETS_STATE.balance!==null){balEl.textContent='⚖️ '+tr('balance')+': '+BETS_STATE.balance+' pts';balEl.classList.remove('hidden');}const koMatches=(STATE.matches||[]).filter(m=>m.no>=89);if(!koMatches.length){box.innerHTML=`<p class="muted">${LANG==='ar'?'لا توجد مباريات إقصائية بعد':'No knockout matches yet'}</p>`;return;}let html='<div class="grid">';koMatches.forEach(m=>{const res=STATE.results&&STATE.results[m.no],pool=BETS_STATE.pools[m.no]||{h:0,a:0,total:0},myBet=SESSION?(BETS_STATE.myBets[m.no]||null):null,L=locked(m),isFinal=m.no===104;let betContent='';if(myBet){const teamName=myBet.team==='H'?m.h:m.a;let tagCls='pending',tag=tr('betPending');if(myBet.settled){const net=myBet.payout-myBet.amount;tagCls=net>=0?'won':'lost';tag=(net>=0?'+':'')+net+' pts';}betContent=`<div class="betBox hasBet"><div class="between"><span class="tiny">${tr('yourBet')}: ${teamHtml(teamName)} <b>${myBet.amount} pts</b></span><span class="betTag ${tagCls}">${tag}</span></div>${betOddsHtml(pool,m.h,m.a)}${!L&&!myBet.settled?`<button class="ghost danger wide" style="margin-top:6px" onclick="doCancelBet(${m.no})">${tr('cancelBet')}</button>`:''}</div>`;}else if(!L&&SESSION&&!res){const maxBet=isFinal?(BETS_STATE.balance||0):Math.floor((BETS_STATE.balance||0)*0.5);betContent=`<div class="betBox"><p class="tiny warnTag pill" style="margin-bottom:8px">${tr('betForfeits')}</p>${betOddsHtml(pool,m.h,m.a)}<div class="row" style="margin-top:8px"><select id="betTeam_${m.no}" style="flex:1"><option value="">${tr('placeBet')}…</option><option value="H">${esc(m.h)}</option><option value="A">${esc(m.a)}</option></select><input id="betAmt_${m.no}" type="number" min="10" max="${maxBet}" placeholder="10–${maxBet}" style="width:90px"><button class="primary" onclick="doPlaceBet(${m.no},false)">${tr('placeBet')}</button></div>${isFinal?`<button class="danger wide" style="margin-top:6px;background:rgba(232,80,80,.15);color:var(--bad)" onclick="doPlaceBet(${m.no},true)">${tr('allIn')} (${BETS_STATE.balance||0} pts)</button>`:''}</div>`;}else{betContent=`<div class="betBox">${betOddsHtml(pool,m.h,m.a)}</div>`;}html+=`<div class="card soft"><div class="matchBadges"><span class="pill">#${m.no}</span>${stageBadge(m)}${res?`<span class="pill statusTag done">${tr('completed')}</span>`:L?`<span class="pill statusTag locked">${tr('locked')}</span>`:`<span class="pill statusTag open">${tr('open')}</span>`}</div><div class="teams">${teamHtml(m.h)}<span class="vs">VS</span>${teamHtml(m.a,'away')}</div><div class="tiny">${localTime(m.iso)}</div>${res?`<div class="tiny" style="margin-top:4px">⚽ ${res.hg}–${res.ag}${res.pen?' (pens)':''}</div>`:''} ${betContent}</div>`;});box.innerHTML=html+'</div>';}
async function doPlaceBet(matchNo,allIn){if(!SESSION)return toast(tr('loginFirst'),true);const teamSel=$('betTeam_'+matchNo),amtEl=$('betAmt_'+matchNo),team=teamSel?teamSel.value:'',amount=allIn?-1:(amtEl?Number(amtEl.value):0);if(!team)return toast(LANG==='ar'?'اختر الفريق':'Choose a team',true);if(!allIn&&amount<10)return toast(LANG==='ar'?'الحد الأدنى 10 نقاط':'Minimum 10 points',true);const r=await call('placeBet',SESSION.id,SESSION.pin,matchNo,team,amount);if(!r.ok)return toast(r.msg,true);toast((LANG==='ar'?'تم الرهان ✓ رصيدك: ':'Bet placed ✓ Balance: ')+r.balance+' pts');BETS_STATE.balance=r.balance;loadBetting();}
async function doCancelBet(matchNo){if(!SESSION)return;if(!confirm(LANG==='ar'?'إلغاء الرهان؟':'Cancel this bet?'))return;const r=await call('cancelBet',SESSION.id,SESSION.pin,matchNo);if(!r.ok)return toast(r.msg,true);toast(LANG==='ar'?'تم الإلغاء':'Cancelled');loadBetting();}
async function adminBets(){$('adminContent').innerHTML='<div class="skeleton"></div>';const r=await call('adminGetBets',ADMIN_PIN);if(!r.ok){$('adminContent').innerHTML=`<p class="muted">${esc(r.msg)}</p>`;return;}const bets=r.bets||[];if(!bets.length){$('adminContent').innerHTML=`<p class="muted">${tr('noBets')}</p>`;return;}let html=`<div class="tableWrap"><table><thead><tr><th>${tr('player')}</th><th>#</th><th>${tr('team')}</th><th>${tr('betAmount')}</th><th>Status</th><th>Net</th><th></th></tr></thead><tbody>`;bets.forEach(b=>{const teamName=b.team==='H'?b.h:b.a,tagCls=!b.settled?'pending':b.payout>=b.amount?'won':'lost',netStr=b.net!==null?(b.net>=0?'+'+b.net:String(b.net)):'—';html+=`<tr><td>${esc(b.playerName)}</td><td>#${b.matchNo}</td><td>${esc(teamName)}</td><td>${b.amount}</td><td><span class="betTag ${tagCls}">${b.settled?(b.payout>=b.amount?tr('betWon'):tr('betLost')):tr('betPending')}</span></td><td>${netStr}</td><td>${!b.settled?`<button class="ghost" onclick="adminManualSettle(${b.matchNo})">Settle</button>`:''}</td></tr>`;});$('adminContent').innerHTML=html+'</tbody></table></div>';}
async function adminManualSettle(matchNo){const r=await call('adminSettleBet',ADMIN_PIN,0,matchNo);if(!r.ok)return toast(r.msg,true);toast('OK');adminBets();}
