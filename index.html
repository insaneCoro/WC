<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WC '26 Prediction League</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0B1F12; }
    iframe {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; display: block;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0B1F12; color: #D4A520;
      font-family: system-ui, sans-serif;
      gap: 16px; z-index: 10;
      transition: opacity .4s;
    }
    #loader svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #7A9E82; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loader">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="16" stroke="#1a3a1a" stroke-width="4"/>
      <path d="M20 4a16 16 0 0 1 16 16" stroke="#D4A520" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p>Loading league…</p>
  </div>
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbyu0mVtIKdUcp7UXfM4HUAMzd_AhRbHzx45GtXLafMdLo7S3_UMgY_IMKoCYk5Eh2LsoA/exec"
    allow="cross-origin-isolated"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation"
    onload="document.getElementById('loader').style.opacity='0';setTimeout(()=>document.getElementById('loader').style.display='none',400)"
  ></iframe>
</body>
</html>
