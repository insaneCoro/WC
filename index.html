<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0d2818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WC'26 Picks">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <title>WC '26 Prediction League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://flagcdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       WC '26 PREDICTION LEAGUE — STADIUM SCOREBOARD THEME
       Palette: Pitch green · Trophy gold · Match card white
       Type: Barlow Condensed (scores/headings) + Barlow (body)
    ═══════════════════════════════════════════════════════ */
    :root {
      /* Surfaces */
      --bg:       #0B1F12;   /* deep pitch green */
      --bg2:      #0E2616;   /* slightly lighter pitch */
      --panel:    #122B19;   /* card background */
      --panel2:   #163220;   /* elevated card */
      --glass:    rgba(18,43,25,.88);

      /* Type */
      --text:     #F0EDE6;   /* warm white */
      --muted:    #7A9E82;   /* sage green */
      --dim:      #4A7255;   /* very muted */

      /* Accent — trophy gold */
      --gold:     #D4A520;
      --gold2:    #F0C842;
      --gold-glow:rgba(212,165,32,.20);
      --gold-line:rgba(212,165,32,.30);

      /* Active UI contrast layer: keeps accent text readable on every theme */
      --active1:   var(--gold);
      --active2:   var(--gold2);
      --active-text:#0B1F12;

      /* Optional third accent used by team themes for subtle inactive UI depth */
      --third:     #7A9E82;
      --third-bg:  rgba(255,255,255,.035);
      --third-line:rgba(255,255,255,.07);

      /* Semantic */
      --good:     #52C97A;   /* correct pick */
      --warn:     #E8A020;   /* locked / warning */
      --bad:      #E85050;   /* wrong */
      --done:     #4AB8C8;   /* completed match */

      /* Betting meter: separate variables so team themes can keep home/away colors distinct */
      --bet-home: var(--gold);
      --bet-away: var(--done);

      /* Lines & shadows */
      --line:     rgba(255,255,255,.09);
      --line2:    rgba(255,255,255,.05);
      --shadow:   0 8px 32px rgba(0,0,0,.45);
      --shadow-sm:0 2px 8px rgba(0,0,0,.30);

      /* Radii */
      --r:        16px;
      --r2:       10px;
      --r-pill:   999px;

      /* Focus */
      --focus:    0 0 0 3px rgba(212,165,32,.35);

      /* Fonts */
      --font-display: 'Barlow Condensed', ui-sans-serif, system-ui, sans-serif;
      --font-body:    'Barlow', ui-sans-serif, system-ui, sans-serif;
      --font-score:   'Barlow Condensed', monospace;
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh;
      font-family: var(--font-body);
      font-size: 15px; line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, var(--gold-glow) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 0% 50%, rgba(0,0,0,.22) 0%, transparent 50%);
      background-attachment: fixed;
    }
    body[dir=rtl] {
      font-family: 'Noto Sans Arabic', 'Barlow', ui-sans-serif, system-ui, sans-serif;
    }
    h1,h2,h3,h4 {
      font-family: var(--font-display);
      font-weight: 700; letter-spacing: .01em;
      margin: 0;
    }
    .hidden  { display: none !important; }
    .muted   { color: var(--muted); }
    .tiny    { font-size: 12px; color: var(--muted); }
    .dim     { color: var(--dim); }

    /* ── Layout shell ── */
    .appShell { max-width: 1280px; margin: auto; padding: 0 16px 48px; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: var(--bg);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--line);
    }
    .topInner {
      max-width: 1280px; margin: auto;
      padding: 12px 16px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--active1), var(--active2));
      color: var(--active-text); font-size: 22px; font-weight: 900;
      box-shadow: 0 0 0 1px var(--gold-line), 0 6px 20px var(--gold-glow);
      overflow: hidden; padding: 0;
    }
    .site-logo {
      width: 100%; height: 100%;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* Navy is the fallback for all unlisted themes */
      background-image: url('/icon-navy-192.png');
    }
    /* Default Pitch theme + all green-background themes */
    html:not([data-theme]) .site-logo,
    html[data-theme=""]      .site-logo,
    html[data-theme="pitch"] .site-logo,
    html[data-theme="saudi"] .site-logo,
    html[data-theme="br"]    .site-logo,
    html[data-theme="pt"]    .site-logo,
    html[data-theme="mx"]    .site-logo  { background-image: url('/icon-green-192.png'); }
    /* Red-background themes */
    html[data-theme="red"]   .site-logo,
    html[data-theme="es"]    .site-logo,
    html[data-theme="ma"]    .site-logo,
    html[data-theme="qa"]    .site-logo,
    html[data-theme="ca"]    .site-logo  { background-image: url('/icon-red-192.png'); }
    /* Orange theme */
    html[data-theme="nl"]    .site-logo  { background-image: url('/icon-orange-192.png'); }
    h1 { font-size: 20px; line-height: 1.1; letter-spacing: .02em; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-body); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Tab nav ── */
    .nav {
      position: sticky; top: 69px; z-index: 55;
      padding: 10px 0 6px;
      background: linear-gradient(180deg, var(--bg) 60%, transparent);
    }
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: var(--r-pill);
      font-family: var(--font-display);
      font-weight: 600; font-size: 14px; letter-spacing: .03em;
      cursor: pointer; transition: all .14s;
    }
    .tab:hover { color: var(--text); border-color: var(--gold-line); }
    .tab.active {
      background: linear-gradient(135deg, var(--active1), var(--active2));
      color: var(--active-text); border-color: transparent; font-weight: 900;
      box-shadow: 0 2px 12px var(--gold-glow);
    }
    .tab:focus-visible { box-shadow: var(--focus); outline: none; }

    /* Subtle third-colour layer for team themes; keeps the same layout/design */
    html[data-team-theme="1"] .tab:not(.active),
    html[data-team-theme="1"] .filter:not(.active),
    html[data-team-theme="1"] .side button:not(.active) {
      background: linear-gradient(135deg, var(--bg2), var(--third-bg));
      border-color: var(--third-line);
    }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card.soft {
      background: var(--bg2);
      box-shadow: none;
      border-color: var(--line2);
    }

    /* ── World Cup Final showcase card ── */
    .finalCard {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border: 2px solid rgba(255,215,92,.88) !important;
      background:
        radial-gradient(circle at 50% -15%, rgba(255,224,116,.30), transparent 42%),
        linear-gradient(145deg, rgba(72,49,5,.96), rgba(18,28,22,.98) 48%, rgba(91,60,5,.92)) !important;
      box-shadow: 0 0 0 1px rgba(255,239,177,.18), 0 18px 46px rgba(0,0,0,.38), 0 0 30px rgba(244,190,45,.23) !important;
      transform: translateZ(0);
    }
    .finalCard::before {
      content: attr(data-final-label);
      position: absolute;
      z-index: 3;
      top: 12px;
      inset-inline-end: -39px;
      width: 150px;
      padding: 7px 0;
      text-align: center;
      transform: rotate(38deg);
      background: linear-gradient(90deg,#b47a08,#ffe28a,#c88a0b);
      color: #291700;
      font: 900 11px/1 var(--font-display);
      letter-spacing: .12em;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    html[dir="rtl"] .finalCard::before { transform: rotate(-38deg); }
    .finalCard::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -80% -35%;
      background: linear-gradient(105deg,transparent 42%,rgba(255,255,255,.13) 49%,transparent 56%);
      animation: finalShine 4.8s ease-in-out infinite;
      pointer-events: none;
    }
    .finalCard .teams { margin-block: 18px 12px; }
    .finalCard .teamName { color: #fff6cf; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
    .finalCard .vs { color: #ffd85c; font-weight: 1000; }
    .finalCard .matchStageLine { color: #ffe28a; letter-spacing: .12em; font-weight: 900; }
    .finalCard .betBox { border-color: rgba(255,216,92,.34); background: rgba(8,15,11,.53); }
    @keyframes finalShine { 0%,58%{transform:translateX(-45%)} 88%,100%{transform:translateX(45%)} }
    .subTabs { display:flex; gap:8px; margin-bottom:12px; padding:4px; border-radius:var(--r2); background:rgba(0,0,0,.10); }
    .subTabs .tab { flex:1; text-align:center; }

    /* ── Layout helpers ── */
    .hero   { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; margin: 14px 0; }
    .grid   { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .row    { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .section{ margin-top: 14px; }
    .wide   { width: 100%; }

    /* ── Buttons, inputs, selects ── */
    button, input, select {
      border-radius: var(--r2);
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--text);
      padding: 10px 13px;
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
    }
    input:focus, select:focus, button:focus-visible {
      box-shadow: var(--focus);
      border-color: var(--gold-line);
    }
    button {
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 700; font-size: 14px; letter-spacing: .03em;
      transition: all .14s; min-height: 40px;
    }
    button:hover  { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--active1), var(--active2));
      color: var(--active-text);
      box-shadow: 0 2px 10px var(--gold-glow);
    }
    button.primary:hover { box-shadow: 0 4px 18px var(--gold-glow); }
    .ghost  { background: rgba(255,255,255,.04); }
    .danger { border-color: rgba(232,80,80,.5); color: #ffcaca; }
    label   { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-family: var(--font-body); }

    /* ── Pills & badges ── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line);
      background: var(--bg2);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      color: var(--muted); font-size: 12px;
      font-family: var(--font-body);
    }
    .saveBadge {
      font-size: 12px; padding: 5px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      background: var(--bg2);
      font-family: var(--font-body);
    }
    .saveBadge.good { color: var(--good); border-color: rgba(82,201,122,.30); }
    .saveBadge.warn { color: var(--warn); border-color: rgba(232,160,32,.30); }
    .saveBadge.bad  { color: var(--bad);  border-color: rgba(232,80,80,.30);  }
    .warnTag  { border-color: rgba(232,160,32,.40); color: var(--warn); background: rgba(232,160,32,.08); }
    .koWarn   { animation: pulse-warn .9s ease-in-out infinite alternate; }
    @keyframes pulse-warn { to { border-color: var(--warn); } }

    /* ── Filter bar ── */
    .filters {
      display: flex; gap: 6px; overflow-x: auto;
      margin: 12px 0; scrollbar-width: none; padding-bottom: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter { white-space: nowrap; padding: 7px 12px; min-height: 34px; font-size: 13px; }
    .filter.groupFilter { min-width: 36px; justify-content: center; padding: 7px 8px; }
    .filter.active { background: rgba(212,165,32,.12); border-color: var(--gold-line); color: var(--gold2); }
    .searchBox { min-width: 200px; flex: 1; }

    /* ── Match card ── */
    .match { padding: 0; overflow: hidden; }
    .matchHead {
      padding: 10px 14px;
      background: linear-gradient(90deg, rgba(212,165,32,.08), transparent);
      border-bottom: 1px solid var(--line2);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .matchBody { padding: 14px; }
    .matchStageLine { display: none; } /* handled by badges */

    /* Teams layout — symmetric matchup tucked around VS */
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 40px;
      margin: 10px 0;
    }
    .team { display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%; justify-content: flex-end; flex-direction: row; }
    .team.away { justify-content: flex-end; flex-direction: row-reverse; }
    body[dir=rtl] .team       { flex-direction: row-reverse; justify-content: flex-end; }
    body[dir=rtl] .team.away  { flex-direction: row; justify-content: flex-end; }
    .flagImg {
      width: 26px; height: 18px; flex-shrink: 0;
      border-radius: 3px; object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
      background: #1a3a22;
    }
    .flagFallback { font-size: 18px; flex-shrink: 0; }
    .teamName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .vs {
      text-align: center; color: var(--dim);
      font-family: var(--font-display); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* ── SCOREBOARD score inputs — the signature element ── */
    .scorebox {
      display: flex; align-items: center;
      justify-content: center; gap: 0; margin: 10px 0;
      background: #070F0A;
      border: 1px solid rgba(212,165,32,.20);
      border-radius: 10px;
      overflow: hidden;
      max-width: 200px; margin-inline: auto;
    }
    .scorebox input {
      width: 72px; flex: 1;
      text-align: center;
      font-family: var(--font-score);
      font-size: 28px; font-weight: 900;
      color: var(--gold2);
      background: transparent;
      border: none; border-radius: 0;
      padding: 10px 4px;
      letter-spacing: .04em;
      -moz-appearance: textfield;
    }
    .scorebox input::-webkit-inner-spin-button,
    .scorebox input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .scorebox input:focus { box-shadow: none; border: none; background: rgba(212,165,32,.06); }
    .scorebox input:disabled { color: var(--muted); }
    .scoreDash {
      width: 1px; align-self: stretch;
      background: rgba(212,165,32,.20);
      flex-shrink: 0;
    }

    /* KO box */
    .koBox {
      margin-top: 8px; padding: 10px;
      border-radius: var(--r2);
      background: rgba(212,165,32,.03);
      border: 1px dashed rgba(212,165,32,.15);
    }
    .koPenaltyText {
      color: var(--gold2);
      border-color: var(--gold-line);
      background: rgba(212,165,32,.08);
      font-weight: 700;
    }
    .koWinnerLabel {
      color: var(--muted);
      font-size: 12px;
      margin-inline-start: 4px;
    }

    /* match locked state */
    .match.locked .matchHead {
      background: linear-gradient(90deg, rgba(255,255,255,.025), transparent);
    }
    .match.locked .scorebox { border-color: var(--line); }
    .match.locked .scorebox input { color: var(--muted); }

    /* ── Status pills ── */
    .matchBadges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .groupBadge {
      width: 32px; height: 26px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px; font-family: var(--font-display);
      font-size: 14px; font-weight: 900; color: #0B1F12; border: none;
      box-shadow: var(--shadow-sm);
    }
    .groupBadge span { font-size: 9px; margin-inline-end: 1px; opacity: .7; }
    .group-a{background:#7DD3FC}.group-b{background:#FCA5A5}.group-c{background:#86EFAC}
    .group-d{background:#FCD34D}.group-e{background:#C4B5FD}.group-f{background:#67E8F9}
    .group-g{background:#6EE7B7}.group-h{background:#F9A8D4}.group-i{background:#A5B4FC}
    .group-j{background:#DDB892}.group-k{background:#A7F3D0}.group-l{background:#93C5FD}

    .stageTag { background: rgba(212,165,32,.10); border-color: var(--gold-line); color: var(--gold2); font-weight: 700; }
    .roundTag { background: rgba(74,184,200,.10); border-color: rgba(74,184,200,.35); color: var(--done); font-weight: 700; }
    .statusTag.open   { color: var(--good); border-color: rgba(82,201,122,.30); }
    .statusTag.locked { color: var(--warn); border-color: rgba(232,160,32,.30); background: rgba(232,160,32,.06); }
    .statusTag.done   { color: var(--done); border-color: rgba(74,184,200,.30); background: rgba(74,184,200,.06); }

    /* ── Quick stats ── */
    .quickCard { padding: 14px; }
    .quickHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .quickHead h2 { font-size: 16px; }
    .quickStats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .stat {
      padding: 12px; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--line2);
      min-height: 68px;
    }
    .stat b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 900; line-height: 1.05; margin-top: 4px; }
    .stat .tiny { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.main {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(212,165,32,.12), rgba(212,165,32,.04));
      border-color: var(--gold-line);
    }
    .stat.main b { font-size: 30px; color: var(--gold2); }
    .progress { height: 6px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s ease; }

    /* ── Points breakdown drawer ── */
    .ptsToggle {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; color: var(--muted);
      cursor: pointer; margin-top: 5px;
      background: none; border: none; padding: 0;
      font-family: var(--font-body); letter-spacing: 0;
      min-height: unset; transition: color .12s;
    }
    .ptsToggle:hover { color: var(--gold2); transform: none; border-color: transparent; }
    .ptsToggle .arr { display: inline-block; transition: transform .18s; font-style: normal; }
    .ptsToggle.open .arr { transform: rotate(180deg); }
    .ptsDrw {
      display: none; margin-top: 8px;
      border-top: 1px solid var(--line2); padding-top: 8px;
    }
    .ptsDrw.open { display: block; }
    .ptsDrwRow {
      display: flex; flex-direction: column;
      padding: 5px 0; gap: 3px;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .ptsDrwRow:last-child { border-bottom: none; }
    .ptsDrwLabel { color: var(--muted); font-size: 11px; }
    .ptsDrwNums { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
    .ptsDrwPts { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--gold2); margin-inline-start: auto; }
    .ptsDrwExact { color: var(--good);  font-family: var(--font-display); font-weight: 700; font-size: 12px; }
    .ptsDrwWin   { color: var(--done);  font-family: var(--font-display); font-weight: 700; font-size: 12px; }
    .ptsDrwWrong { color: var(--bad);   font-family: var(--font-display); font-weight: 700; font-size: 12px; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line2); text-align: start; vertical-align: middle; }
    th { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg2); position: sticky; top: 0; }
    tr:hover td { background: rgba(212,165,32,.03); }
    .statusTag.live  { background:rgba(255,59,59,.15); color:#ff3b3b; border:1px solid rgba(255,59,59,.3); }
    .liveBadge { display:inline-flex; align-items:center; gap:5px; color:#ff3b3b; font-weight:700; font-size:12px; letter-spacing:.02em; }
    .liveDot { width:7px; height:7px; background:#ff3b3b; border-radius:50%; flex-shrink:0; animation:livePulse 1.3s ease-in-out infinite; }
    @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.65)} }
    .spinner { display:flex; align-items:center; justify-content:center; padding:48px 16px; gap:10px; color:var(--muted); font-size:14px; }
    .spinner::before { content:''; flex-shrink:0; width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* Champion picks table has only 3–4 narrow columns, so it must NOT inherit the
       580px floor that wide tables use — that floor pushed the team column off-screen
       on phones. Fit it to the viewport and let team names wrap instead of truncate. */
    .champTable { min-width: 0; }
    .champTable th, .champTable td { padding: 9px 8px; }
    .champTable td:first-child, .champTable th:first-child { width: 30px; }
    .champTable .team { flex-wrap: wrap; }
    .champTable .teamName { white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word; }
    .rank1 td:first-child { color: var(--gold2); font-family: var(--font-display); font-size: 18px; font-weight: 900; }

    /* ── Rules ── */
    .ruleGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; }
    .ruleTile {
      padding: 16px; border-radius: 14px;
      background: var(--bg2); border: 1px solid var(--line2);
    }
    .ruleTile b { display: block; margin-top: 6px; font-family: var(--font-display); font-size: 24px; font-weight: 900; color: var(--gold2); }

    /* ── Admin layout ── */
    .adminLayout { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
    .adminLayout > *:last-child { min-width: 0; overflow-x: hidden; }
    .side {
      position: sticky; top: 132px;
      display: grid; gap: 4px;
      background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px;
    }
    .side button { text-align: start; justify-content: flex-start; border-color: transparent; background: transparent; }
    .side button:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
    .side button.active {
      background: linear-gradient(135deg, var(--active1), var(--active2));
      color: var(--active-text); border-color: transparent;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; z-index: 100; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel2); border: 1px solid var(--line);
      box-shadow: var(--shadow); border-radius: var(--r);
      padding: 12px 18px; max-width: min(92vw, 480px);
      font-family: var(--font-body); font-size: 14px;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(10px); } }
    .toast.err { border-color: rgba(232,80,80,.50); color: #ffcaca; }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: var(--r); min-height: 130px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Group standings ── */
    .standingsGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px,1fr)); gap: 12px; }
    .groupTitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .groupTitle h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
    .groupMeta { font-size: 11px; color: var(--muted); }
    .groupLetterBig { width: 40px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 900; color: #0B1F12; flex-shrink: 0; }
    .rankCell { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
    .standingsTable { min-width: 320px; }
    .standingsTable td, .standingsTable th { padding: 8px 6px; }
    .flagFallback { display: none; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .adminLayout { grid-template-columns: 1fr; }
      .quickStats { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .stat.main { grid-column: span 1; }
      .stat b { font-size: 18px; }
      .stat.main b { font-size: 22px; }
      .topInner { align-items: flex-start; padding: 10px 14px; }
      .side { position: static; display: flex; overflow-x: auto; flex-wrap: nowrap; }
      .side button { white-space: nowrap; }
      .appShell { padding-inline: 12px; }
      .card { padding: 14px; border-radius: 14px; }
      .nav { top: 68px; }
      .logo { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
      h1 { font-size: 17px; }
      .standingsGrid { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .quickStats { grid-template-columns: 1fr 1fr; }
      .stat.main { grid-column: span 2; }
      .playerHeroText { display: none; }
      .grid { grid-template-columns: 1fr; }
      .teamName { font-size: 13px; }
      .scorebox input { font-size: 24px; width: 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  
    /* ══════════════════════════════════════════
       THEMES  —  applied via html[data-theme]
       Default (no attr) = Pitch Green (current)
    ══════════════════════════════════════════ */

    /* ── Night Sky (deep navy + electric violet) ── */
    html[data-theme="night"] {
      --bg:        #0A0D1A;
      --bg2:       #0D1120;
      --panel:     #111727;
      --panel2:    #151D30;
      --text:      #E8EEFF;
      --muted:     #6B7DB3;
      --dim:       #3D4D7A;
      --gold:      #7C6FED;
      --gold2:     #A89CF7;
      --gold-glow: rgba(124,111,237,.22);
      --gold-line: rgba(124,111,237,.30);
      --focus:     0 0 0 3px rgba(124,111,237,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="night"] body {
      background-image:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(124,111,237,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 100% 100%, rgba(20,15,50,.8) 0%, transparent 50%);
    }

    /* ── Desert Sand (warm amber + terracotta) ── */
    html[data-theme="desert"] {
      --bg:        #1A1208;
      --bg2:       #1F1710;
      --panel:     #271B0E;
      --panel2:    #2E2012;
      --text:      #F5EDD8;
      --muted:     #9A8060;
      --dim:       #5C4A2A;
      --gold:      #E07820;
      --gold2:     #F5A040;
      --gold-glow: rgba(224,120,32,.22);
      --gold-line: rgba(224,120,32,.32);
      --focus:     0 0 0 3px rgba(224,120,32,.35);
      --line:      rgba(255,255,255,.08);
      --line2:     rgba(255,255,255,.04);
    }
    html[data-theme="desert"] body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(224,120,32,.10) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 0% 80%, rgba(40,20,5,.7) 0%, transparent 50%);
    }

    /* ── Ice (silver + cyan, light mode) ── */
    html[data-theme="ice"] {
      --bg:        #EEF2F7;
      --bg2:       #E4EAF2;
      --panel:     #FFFFFF;
      --panel2:    #F8FAFC;
      --text:      #0F1E2E;
      --muted:     #5A7898;
      --dim:       #94AEC4;
      --gold:      #0078C8;
      --gold2:     #1A9AE8;
      --gold-glow: rgba(0,120,200,.15);
      --gold-line: rgba(0,120,200,.25);
      --focus:     0 0 0 3px rgba(0,120,200,.25);
      --line:      rgba(0,0,0,.10);
      --line2:     rgba(0,0,0,.06);
      --shadow:    0 4px 20px rgba(0,0,0,.10);
      --shadow-sm: 0 1px 4px rgba(0,0,0,.08);
      --good:      #18A060;
      --warn:      #D07000;
      --bad:       #C83030;
    }
    html[data-theme="ice"] body {
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,120,200,.07) 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 100% 100%, rgba(200,230,255,.5) 0%, transparent 50%);
    }
    html[data-theme="ice"] button, html[data-theme="ice"] input, html[data-theme="ice"] select {
      background: #FFFFFF;
    }
    html[data-theme="ice"] .ghost { background: rgba(0,0,0,.05); }
    html[data-theme="ice"] .tab   { background: rgba(0,0,0,.04); }
    html[data-theme="ice"] .card  { background: #FFFFFF; }

    html[data-theme="ice"] .scorebox { background: #0D1E2E; }

    /* Stadium podium — impact stays inside the leaderboard, no extra banner */
    .podium{position:relative;isolation:isolate;overflow:hidden;padding:48px 16px 20px;border:1px solid rgba(212,165,32,.22);border-radius:22px;background:radial-gradient(ellipse at 50% -15%,rgba(255,228,133,.24),transparent 38%),linear-gradient(180deg,rgba(7,36,22,.84),rgba(4,19,13,.28) 64%,rgba(212,165,32,.08));box-shadow:inset 0 -18px 40px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.16)}

    .koTeamRow.lose{opacity:.45}
    .koSlot.ph{font-size:12px;color:var(--muted);font-style:italic;padding:2px 0}

    /* tree (split bracket) */
    .bracketScroll{overflow:auto;padding:8px 2px 16px;touch-action:pan-x pan-y pinch-zoom}
    .bracketScroll::-webkit-scrollbar{height:8px}
    .bracketScroll::-webkit-scrollbar-thumb{background:var(--gold-line);border-radius:999px}
    .bracketZoomCtrl{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
    .bracketZoomBtns{display:flex;align-items:center;gap:4px}
    .bracketZoomBtns button{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
    .bracketZoomLbl{font-size:12px;color:var(--muted);min-width:36px;text-align:center}
    .bracketZoomWrap{position:relative}
    .bracketTree{transform-origin:top left;display:inline-flex;transition:transform .15s}
    .bracketTree{display:flex;align-items:stretch;justify-content:center;min-width:max-content}
    .halfTree{display:flex;align-items:center}
    .branch{display:flex;align-items:center}
    .branch>.children{display:flex;flex-direction:column;justify-content:center;position:relative}
    .branch>.children>*{margin:6px 0;position:relative}
    .halfTree.left .branch{flex-direction:row}
    .halfTree.left .branch>.children>.branch::after,
    .halfTree.left .branch>.children>.leaf::after{content:'';position:absolute;right:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.left .branch>.children::before{content:'';position:absolute;right:-14px;top:25%;bottom:25%;width:2px;background:var(--gold-line)}
    .halfTree.left .branch>.parent{margin-left:28px;position:relative}
    .halfTree.left .branch>.parent::before{content:'';position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.left>.branch>.parent::after{content:'';position:absolute;right:-20px;top:50%;width:20px;height:2px;background:var(--gold-line)}
    .halfTree.right .branch{flex-direction:row-reverse}
    .halfTree.right .branch>.children>.branch::after,
    .halfTree.right .branch>.children>.leaf::after{content:'';position:absolute;left:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.right .branch>.children::before{content:'';position:absolute;left:-14px;top:25%;bottom:25%;width:2px;background:var(--gold-line)}
    .halfTree.right .branch>.parent{margin-right:28px;position:relative}
    .halfTree.right .branch>.parent::before{content:'';position:absolute;right:-14px;top:50%;width:14px;height:2px;background:var(--gold-line)}
    .halfTree.right>.branch>.parent::after{content:'';position:absolute;left:-20px;top:50%;width:20px;height:2px;background:var(--gold-line)}
    .centerCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 8px;align-self:center}
    .finalBox{display:flex;flex-direction:column;align-items:center;gap:5px}
    .champCrown{font-size:26px;line-height:1}
    .finalBox .koMatch{min-width:172px;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-line),0 6px 20px var(--gold-glow)}
    .thirdBox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
    .koRoundCap{font:700 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}
    .koRoundCap.muted2{color:var(--muted)}

    /* ── Bracket board view: compact, theme-safe, stage-filtered ── */
    .bracketModeBtns{display:none}
    .bracketQuickNav{display:none}
    .koBoardScroll{overflow:auto;padding:8px 0 16px;-webkit-overflow-scrolling:touch;cursor:grab;}
    .koBoardScroll:active{cursor:grabbing;}
    .koBoardScroll .bracketZoomWrap{margin:0 auto;}
    .koBoardScroll .bracketZoomWrap{overflow:visible;background:transparent!important}
    .koBoardTree{display:inline-block!important;align-items:initial!important;justify-content:initial!important}
    .koBoard{position:relative;width:1238px;height:700px;border-radius:18px;overflow:hidden;
      background-color:var(--panel);
      background-image:
        radial-gradient(circle at 50% 43%,var(--gold-glow),transparent 16%),
        radial-gradient(circle at 50% 43%,rgba(255,255,255,.035),transparent 28%),
        linear-gradient(135deg,rgba(255,255,255,.035),rgba(0,0,0,.06));
      border:1px solid var(--line);box-shadow:var(--shadow);isolation:isolate}
    html[data-theme="ice"] .koBoard,
    html[data-theme="jp"] .koBoard{background-color:var(--panel);background-image:radial-gradient(circle at 50% 43%,var(--gold-glow),transparent 16%),linear-gradient(135deg,rgba(255,255,255,.35),rgba(0,0,0,.035))}
    .koBoard::before{content:'🏆';position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:104px;line-height:1;opacity:.055;filter:drop-shadow(0 8px 20px rgba(0,0,0,.50));pointer-events:none;z-index:0}
    .koFinalHalo{position:absolute;transform:translate(-50%,-50%);width:250px;height:220px;border-radius:38px;background:radial-gradient(circle,rgba(212,165,32,.17),rgba(212,165,32,.07) 34%,transparent 72%);filter:blur(.2px);opacity:.65;z-index:0;pointer-events:none}
    .koFinalLabel{position:absolute;transform:translateX(-50%);z-index:3;padding:4px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(212,165,32,.22),rgba(240,200,66,.08));border:1px solid var(--gold-line);font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold2);box-shadow:0 0 18px var(--gold-glow);pointer-events:none}
    .koThirdLabel{position:absolute;transform:translateX(-50%);z-index:3;padding:3px 11px;border-radius:999px;background:rgba(190,112,42,.12);border:1px solid rgba(224,151,74,.34);font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#e7b879;opacity:1;pointer-events:none}
    .koBoardSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
    .koWire{fill:none;stroke:var(--gold-line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.72;filter:drop-shadow(0 0 2px rgba(0,0,0,.18))}
    .koWire.dim{stroke:var(--line);opacity:.50}
    .koWire.final{stroke:var(--gold);stroke-width:2.5;filter:drop-shadow(0 0 5px var(--gold-glow));opacity:.88}
    .koWire.third{stroke:var(--muted);stroke-dasharray:5 5;opacity:.34}
    .koWire.advance{stroke:var(--good);stroke-width:2.8;opacity:.96;filter:drop-shadow(0 0 5px rgba(82,201,122,.35))}
    .koWire.third.advance{stroke:var(--warn);opacity:.62;filter:drop-shadow(0 0 4px rgba(232,160,32,.22))}
    .koRoundTitle{position:absolute;top:13px;height:24px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--font-display);font-weight:560;font-size:11px;letter-spacing:.055em;text-transform:uppercase;color:var(--muted);z-index:4;opacity:.95;background:transparent;border:0;border-radius:999px;padding:0 6px;min-height:0;box-shadow:none;cursor:pointer;pointer-events:auto}
    .koRoundTitle:hover{background:rgba(212,165,32,.10);color:var(--text);transform:none;border:0}
    .koRoundTitle.active{background:rgba(212,165,32,.12);color:var(--gold2);outline:1px solid var(--gold-line)}
    .koRoundTitle.center{font-size:12.5px;color:var(--gold2)}
    .koBoardCard{position:absolute;z-index:2;width:108px;height:58px;min-height:0;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(255,255,255,.018)),var(--panel);border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.16);padding:3px 4px;display:flex;flex-direction:column;justify-content:center;transition:border-color .12s,box-shadow .12s;pointer-events:none;cursor:default}
    .koBoardCard:hover{transform:none}
    .koBoardCard.done{border-color:rgba(82,201,122,.30)}
    .koBoardCard.open{border-color:rgba(82,201,122,.20)}
    .koBoardCard.locked{border-color:rgba(232,160,32,.22)}
    .koBoardCard.final{width:216px;height:128px;min-height:0;border-color:var(--gold);border-width:1.3px;background:linear-gradient(180deg,rgba(212,165,32,.10),rgba(0,0,0,.08)),var(--panel);box-shadow:0 0 0 1px var(--gold-line),0 7px 22px var(--gold-glow),0 6px 18px rgba(0,0,0,.22);padding:6px}
    .koBoardCard.third{width:170px;height:90px;opacity:1;overflow:hidden;border:1.5px solid rgba(224,151,74,.72);border-style:solid;background:radial-gradient(circle at 50% -20%,rgba(231,164,88,.22),transparent 48%),linear-gradient(145deg,rgba(92,48,18,.92),rgba(25,31,25,.98) 58%,rgba(69,38,19,.92));box-shadow:0 0 0 1px rgba(224,151,74,.12),0 10px 24px rgba(0,0,0,.28),0 0 20px rgba(190,112,42,.15);padding:7px 8px}
    .koBoardCard.third::before{content:'🥉';position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:58px;opacity:.075;filter:drop-shadow(0 7px 12px rgba(0,0,0,.45));pointer-events:none}
    .koBoardCard.third>*{position:relative;z-index:1}
    .koBoardCard.third .koMiniTop{margin-bottom:4px}
    .koBoardCard.third .koMiniNo{background:linear-gradient(135deg,#c77732,#e5a45f);border-color:transparent;color:#24140a;font-size:10px;font-weight:900;padding:3px 7px}
    .koBoardCard.third .koMiniState{color:#efc18f;font-size:9.5px;font-weight:750;max-width:88px}
    .koBoardCard.third .koMiniTeam{min-height:25px;padding:3px 5px;border-radius:8px;background:rgba(0,0,0,.13)}
    .koBoardCard.third .koMiniTeam+.koMiniTeam{margin-top:3px}
    .koBoardCard.third .koMiniTeam .team{display:grid;grid-template-columns:23px minmax(0,1fr);align-items:center;justify-content:stretch;gap:7px;width:100%;direction:ltr}
    .koBoardCard.third .koMiniTeam .teamName,.koBoardCard.third .koMiniTeam .teamCode{font-size:12px;font-weight:800;color:#f8e8d5;max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .koBoardCard.third .koMiniTeam .teamName{text-align:left}
    .koBoardCard.third .koMiniTeam .flagImg{width:23px;height:16px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
    .koBoardCard.third .koMiniScore{font-size:16px;min-width:18px;color:#efb66f;font-weight:950}
    .koMiniTop{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:2px}
    .koMiniNo{font:450 8.5px/1 var(--font-body);background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:999px;padding:2px 5px;color:var(--muted);letter-spacing:0}
    .koMiniState{font-size:7.8px;color:var(--muted);white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
    .koBoardCard.final .koMiniNo{background:linear-gradient(135deg,var(--active1),var(--active2));color:var(--active-text);border-color:transparent;font-size:10.5px;padding:3px 7px;font-weight:650}
    .koBoardCard.final .koMiniState{color:var(--gold2);font-weight:500;max-width:76px}
    .koMiniTeam{display:flex;align-items:center;justify-content:space-between;gap:3px;padding:1px 3px;border-radius:7px;min-height:16px}
    .koMiniTeam+.koMiniTeam{margin-top:1px}
    .koMiniTeam .team{min-width:0;gap:4px;flex:1}
    .koMiniTeam .flagImg{width:16px;height:11px;border-radius:3px}
    .koMiniTeam .teamCode{font-size:9.5px;font-weight:480;letter-spacing:.01em;color:var(--text)}
    .koBoardCard.final .koMiniTeam{min-height:22px;padding:3px 4px}
    .koBoardCard.final .koMiniTeam .teamCode{font-size:11px;font-weight:560}
    .koBoardCard.final .koMiniTeam .flagImg{width:21px;height:15px}
    .koMiniTeam .flagFallback{font-size:13px}
    .koMiniScore{font-family:var(--font-display);font-size:10.5px;font-weight:500;min-width:11px;text-align:end;color:var(--text)}
    .koBoardCard.final .koMiniScore{font-size:15px;min-width:18px;color:var(--gold2)}
    .koMiniTeam.win{background:rgba(82,201,122,.12)}
    .koMiniTeam.win .teamCode,.koMiniTeam.win .koMiniScore{color:var(--good)}
    .koMiniTeam.lose{opacity:.50}
    .koSlotMini{font:450 8.5px/1.2 var(--font-body);letter-spacing:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:70px;background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:999px;padding:2px 5px}
    .koBoardCard.final .koSlotMini{max-width:116px;color:var(--gold2);border-color:var(--gold-line);background:rgba(212,165,32,.10)}
    /* Premium bracket Final — large enough to read on desktop and phone */
    .koBoardCard.final{
      overflow:hidden;border-radius:19px!important;border:2px solid #f3c94f!important;padding:10px 11px!important;
      background:
        radial-gradient(circle at 50% -10%,rgba(255,235,155,.34),transparent 42%),
        linear-gradient(145deg,rgba(98,63,3,.96),rgba(18,30,22,.98) 52%,rgba(73,47,3,.96))!important;
      box-shadow:0 0 0 2px rgba(255,224,117,.16),0 15px 34px rgba(0,0,0,.38),0 0 34px rgba(244,190,45,.32)!important;
    }
    .koBoardCard.final::before{content:'🏆';position:absolute;z-index:0;left:50%;top:51%;transform:translate(-50%,-50%);font-size:78px;opacity:.09;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));pointer-events:none}
    .koBoardCard.final::after{content:'';position:absolute;z-index:1;inset:-70% -45%;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.16) 50%,transparent 57%);animation:koFinalShine 4.8s ease-in-out infinite;pointer-events:none}
    .koBoardCard.final>*{position:relative;z-index:2}
    .koBoardCard.final .koMiniTop{margin-bottom:7px}
    .koBoardCard.final .koMiniNo{font-size:11.5px;padding:4px 9px;box-shadow:0 3px 10px rgba(0,0,0,.24)}
    .koBoardCard.final .koMiniState{font-size:10px;max-width:108px;color:#ffe994;font-weight:800}
    .koBoardCard.final .koMiniTeam{min-height:32px;padding:5px 7px;border-radius:10px;background:rgba(0,0,0,.16)}
    .koBoardCard.final .koMiniTeam+.koMiniTeam{margin-top:4px}
    .koBoardCard.final .koMiniTeam .team{display:grid;grid-template-columns:27px minmax(0,1fr);align-items:center;justify-content:stretch;gap:8px;width:100%;direction:ltr}
    .koBoardCard.final .koMiniTeam .teamName,.koBoardCard.final .koMiniTeam .teamCode{font-size:13.5px;font-weight:900;color:#fff7d4;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .koBoardCard.final .koMiniTeam .teamName{text-align:left}
    .koBoardCard.final .koMiniTeam .flagImg{width:27px;height:19px;box-shadow:0 2px 7px rgba(0,0,0,.30)}
    .koBoardCard.final .koMiniScore{font-size:20px;min-width:23px;color:#ffe06a;font-weight:1000}
    .koBoardCard.final.done .koMiniTeam.win{background:linear-gradient(90deg,rgba(82,201,122,.25),rgba(255,215,82,.13));box-shadow:inset 0 0 0 1px rgba(255,226,120,.18)}
    .koBoardCard.final.done .koMiniTeam.win::after{content:'🏆';font-size:14px;margin-inline-start:3px}
    .koFinalHalo{width:326px;height:270px;background:radial-gradient(circle,rgba(255,210,66,.23),rgba(212,165,32,.08) 42%,transparent 73%)}
    .koFinalLabel{font-size:18px;font-weight:1000;padding:6px 18px;border-color:rgba(255,218,91,.72);box-shadow:0 0 26px rgba(244,190,45,.30)}
    @keyframes koFinalShine{0%,58%{transform:translateX(-42%)}88%,100%{transform:translateX(42%)}}
    .koBoardNote{display:none}
    /* ── Phone half-bracket tree view (≤700px) ── */
    .koPhoneTree{padding:2px 0 8px}
    .koSeg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 8px}
    .koSegBtn{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.03em;padding:7px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:0}
    .koSegBtn.active{background:linear-gradient(135deg,var(--active1),var(--active2));color:var(--active-text)}
    .koHalfScroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 0 12px;touch-action:pan-x pan-y;border-radius:14px}
    .koHalfScroll::-webkit-scrollbar{height:8px;width:8px}
    .koHalfScroll::-webkit-scrollbar-thumb{background:var(--gold-line);border-radius:999px}
    .koHalfBoard{display:inline-block}
    /* per-round text scaling — bigger boxes get adequately bigger text */
    .koBoardCard.ko-r16 .koMiniTeam .teamCode{font-size:10.5px}
    .koBoardCard.ko-r16 .koMiniScore{font-size:11.5px}
    .koBoardCard.ko-r16 .koMiniTeam .flagImg{width:17px;height:12px}
    .koBoardCard.ko-qf .koMiniTeam .teamCode{font-size:11.5px}
    .koBoardCard.ko-qf .koMiniScore{font-size:12.5px}
    .koBoardCard.ko-qf .koMiniTeam .flagImg{width:18px;height:13px}
    .koBoardCard.ko-qf .koMiniNo,.koBoardCard.ko-sf .koMiniNo{font-size:9.5px}
    .koBoardCard.ko-qf .koMiniState,.koBoardCard.ko-sf .koMiniState{font-size:8.5px;max-width:80px}
    .koBoardCard.ko-sf .koMiniTeam .teamCode{font-size:12.5px}
    .koBoardCard.ko-sf .koMiniScore{font-size:14px}
    .koBoardCard.ko-sf .koMiniTeam .flagImg{width:19px;height:14px}
    .koBoardCard.ko-sf .koMiniTeam,.koBoardCard.ko-qf .koMiniTeam{min-height:18px}

    @media(max-width:700px){.bracketZoomCtrl{align-items:flex-start;flex-direction:column;gap:6px}.bracketZoomBtns{width:100%;overflow-x:auto;flex-wrap:nowrap}.koBoard{border-radius:14px}.koBoardCard{box-shadow:0 2px 8px rgba(0,0,0,.16)}.koRoundTitle{top:10px;font-size:9.5px}.koFinalLabel{font-size:14px;padding:4px 12px}.koThirdLabel{font-size:11px;padding:3px 9px}.koBoard::before{font-size:70px;opacity:.035}.koBoardCard.final{border-radius:17px!important;padding:9px 10px!important}.koBoardCard.final .koMiniTeam .teamName,.koBoardCard.final .koMiniTeam .teamCode{font-size:13px;max-width:122px}.koBoardCard.final .koMiniScore{font-size:19px}.koBoardCard.third .koMiniTeam .teamName,.koBoardCard.third .koMiniTeam .teamCode{font-size:11.5px;max-width:104px}.koFinalHalo{width:260px;height:220px}.koHalfScroll{scroll-padding-inline:20px}}

  </style>
</head>
<body>
<header class="topbar">
  <div class="topInner">
    <div class="brand"><div class="logo"><div class="site-logo"></div></div><div><h1 id="appTitle"></h1><div id="subtitle" class="subtitle"></div></div></div>
    <div class="actions"><button class="ghost" id="langBtn" onclick="toggleLang()"></button><button class="ghost" onclick="toggleThemePicker()" title="Theme" style="font-size:18px;padding:8px 10px;min-height:36px">🎨</button><button class="ghost" onclick="location.reload()" data-i18n="refresh"></button></div>
  </div>
</header>
<div id="themePanel" class="hidden" style="position:sticky;top:69px;z-index:59;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);">
  <div style="max-width:1280px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span class="tiny" style="flex-shrink:0">Theme:</span>
    <div id="themePickerWrap" class="filters" style="margin:0;flex:1;min-width:0"></div>
  </div>
</div>
<div class="appShell">
  <section id="setup" class="card section hidden">
    <h2 data-i18n="firstSetup"></h2><p class="muted" data-i18n="setupText"></p>
    <div class="row"><input id="setupPin" maxlength="4" inputmode="numeric" data-placeholder-i18n="adminPin4"><button class="primary" onclick="setupLeague()" data-i18n="createLeague"></button></div>
  </section>
  <section id="app" class="hidden">
    <nav class="nav"><div class="tabs">
      <button id="tabPred" class="tab active" onclick="showTab('pred')" data-i18n="predictions"></button>
      <button id="tabOdds" class="tab" onclick="showTab('odds')" data-i18n="odds"></button>
      <button id="tabBoard" class="tab" onclick="showTab('board')" data-i18n="leaderboard"></button>
      <button id="tabGroups" class="tab" onclick="showTab('groups')" data-i18n="groups"></button>
      <button id="tabBracket" class="tab" onclick="showTab('bracket')" data-i18n="bracket"></button>
      <button id="tabBetting" class="tab" onclick="showTab('betting')" data-i18n="betting"></button>
      <button id="tabChampion" class="tab" onclick="showTab('champion')" data-i18n="championTitle"></button>
      <button id="tabRules" class="tab" onclick="showTab('rules')" data-i18n="rules"></button>
      <button id="tabAdmin" class="tab" onclick="showTab('admin')" data-i18n="admin"></button>
    </div></nav>
    <section id="pred">
      <div class="hero">
        <div class="card">
          <div class="between"><div><h2 data-i18n="playerArea"></h2><p class="muted" data-i18n="playerHelp"></p></div><span id="saveStatus" class="saveBadge"></span></div>
          <div id="loginBox" class="row">
            <select id="playerSelect" onchange="updateNameBoxVisibility()"></select>
            <input id="playerName" maxlength="30" data-placeholder-i18n="displayNameOnce">
            <input id="playerPin" maxlength="4" inputmode="numeric" data-placeholder-i18n="pin4">
            <button class="primary" onclick="playerLogin()" data-i18n="login"></button>
          </div>
          <p id="nameOnceHint" class="tiny"></p>
          <div id="helloBox" class="hidden row"><b id="hello"></b><button class="ghost" onclick="logout()" data-i18n="logout"></button><button class="primary" onclick="manualSave()" data-i18n="saveNow"></button></div>
        </div>
        <div class="card quickCard"><div class="quickHead"><h2 data-i18n="quickStats"></h2><span class="pill" id="quickHint">Live</span></div><div id="stats" class="quickStats"></div></div>
      </div>
      <div class="card soft">
        <div class="between"><div class="filters" id="filters"></div><input id="search" class="searchBox" oninput="renderMatches()" data-placeholder-i18n="searchTeams"></div>
      </div>

    if(!clientV){localStorage.setItem(WC26_VERSION_KEY,String(serverV));return;}

// ── Points breakdown: computed client-side from STATE + PREDS ──
// Mirrors server _scoreValues() and _scoreOne() exactly using the same match number ranges.
function computeStageBreakdown(){
  const matches=STATE.matches||[], results=STATE.results||{}, mine=PREDS||{};
  const stages=[
    {key:'grp',  en:'Groups',    ar:'المجموعات', nos:[1,72]},
    {key:'r32',  en:'R32',       ar:'دور ٣٢',    nos:[73,88]},
    {key:'r16',  en:'R16',       ar:'دور ١٦',    nos:[89,96]},
    {key:'qf',   en:'QF',        ar:'ربع النهائي',nos:[97,100]},
    {key:'sf',   en:'SF',        ar:'نصف النهائي',nos:[101,102]},
    {key:'3rd',  en:'3rd',       ar:'المركز ٣',  nos:[103,103]},
    {key:'final',en:'Final',     ar:'النهائي',   nos:[104,104]},
  ];
  const vals={grp:{e:2,o:1,w:0},r32:{e:6,o:3,w:-3},r16:{e:8,o:4,w:-4},qf:{e:12,o:6,w:-6},sf:{e:20,o:10,w:-10},'3rd':{e:20,o:10,w:-10},final:{e:32,o:16,w:-16}};

  return stages.map(s=>{
    let pts=0, exact=0, win=0, wrong=0, played=0;
    matches.forEach(m=>{
      const no=m.no;
      if(no<s.nos[0]||no>s.nos[1])return;
      const r=results[no]; if(!r)return;
      const p=mine[no]||mine[String(no)]; if(!p)return;
      if(p.hg===''||p.hg==null||p.ag===''||p.ag==null)return;
      played++;
      const ko=no>=73;
      const hg=Number(p.hg),ag=Number(p.ag),rhg=Number(r.hg),rag=Number(r.ag);
      const scoreExact=hg===rhg&&ag===rag;
      const predW=hg>ag?'H':ag>hg?'A':(p.w||'D');
      const resW=rhg>rag?'H':rag>rhg?'A':(r.w||'D');
      const v=vals[s.key];
      if(!ko){
        if(scoreExact){pts+=v.e;exact++;}
        else if(predW===resW){pts+=v.o;win++;}
        else{wrong++;}
      } else {
        if(resW==='D')return; // incomplete KO result
        const correctQ=predW===resW;
        if(!correctQ){pts+=v.w;wrong++;}
        else{
          let isExact=false;
          if(r.pen){isExact=scoreExact&&!!(p.pen||(hg===ag&&!!p.w))&&p.w===r.w;}
          else{isExact=scoreExact;}
          if(isExact){pts+=v.e;exact++;}else{pts+=v.o;win++;}
        }
      }
    });
    return {key:s.key,label:LANG==='ar'?s.ar:s.en,pts,exact,win,wrong,played};
  }).filter(s=>s.played>0);
}

function _scoreOnClient(pred, result, matchNo, stage) {
  // Mirrors server _scoreOne but client-side for card display.
  if (!pred || !result) return null;
  const ko = matchNo >= 73;
  const hg = Number(pred.hg), ag = Number(pred.ag);
  if (!Number.isFinite(hg) || !Number.isFinite(ag)) return null;
  const rhg = Number(result.hg), rag = Number(result.ag);
  const scoreExact = hg === rhg && ag === rag;
  const predW = hg > ag ? 'H' : ag > hg ? 'A' : (pred.w === 'H' || pred.w === 'A' ? pred.w : 'D');
  const resW  = rhg > rag ? 'H' : rag > rhg ? 'A' : (result.w === 'H' || result.w === 'A' ? result.w : 'D');
  const correctQ = resW !== 'D' && predW === resW;
  if (!ko) {
    if (scoreExact) return {cls:'exact', pts: 2};
    if (predW === resW) return {cls:'outcome', pts: 1};
    return {cls:'wrong', pts: 0};
  }
  // Values mirror the server's _scoreValues() exactly (check #103 before the semis).
  const vals = matchNo===104 ? {e:32,o:16,w:-16} :   // Final
               matchNo===103 ? {e:20,o:10,w:-10} :   // 3rd-place play-off
               matchNo>=101  ? {e:20,o:10,w:-10} :   // Semi-finals (101–102)
               matchNo>=97   ? {e:12,o:6, w:-6}  :   // Quarter-finals (97–100)
               matchNo>=89   ? {e:8, o:4, w:-4}  :   // Round of 16 (89–96)
                               {e:6, o:3, w:-3};     // Round of 32 (73–88)
  if (resW !== 'H' && resW !== 'A') return {cls:'nopred', pts:0, label:LANG==='ar'?'النتيجة ناقصة':'Incomplete result'};

  // Historical protection: if an old KO draw was saved without a qualifier,
  // never show it as a wrong-team penalty on the card. It can only receive the
  // scoreline-only part when the 120-minute score is exact.
  if (predW !== 'H' && predW !== 'A') {
    const scoreOnlyPts = scoreExact ? Math.max(0, vals.e - vals.o) : 0;
    return {cls:scoreExact?'outcome':'nopred', pts:scoreOnlyPts, label:LANG==='ar'?'نتيجة فقط':'Score only'};
  }

  if (!correctQ) return {cls:'wrong', pts: vals.w};
  if (result.pen) {
    const penEx = scoreExact && (pred.pen || (hg === ag && !!pred.w)) && pred.w === result.w;
    return penEx ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
  }
  return scoreExact ? {cls:'exact', pts:vals.e} : {cls:'outcome', pts:vals.o};
}

/* Shared ordering for Predictions + Odds pages.
   Chronological, but a started/finished match stays visible among the
   current matches until the match-after-next has also kicked off.
   Concretely: a started match sinks to the bottom only once >= 2
   later-scheduled matches have started. */
function matchOrderKey(list){
  const now=Date.now();
  // Sort all by kickoff ascending first
  const byTime=list.slice().sort((a,b)=>{
    const ta=new Date(a.iso||'2999').getTime()||9e15;
    const tb=new Date(b.iso||'2999').getTime()||9e15;
    return ta-tb;
  });
  // For each match, count how many LATER matches have already started
  const started=m=>{const t=new Date(m.iso||'').getTime();return !isNaN(t)&&now>=t;};
  const idx={};
  byTime.forEach((m,i)=>idx[m.no]=i);
  return byTime.map(m=>{
    const t=new Date(m.iso||'2999').getTime()||9e15;
    const s=started(m);
    // count later matches (by schedule) that have started
    let laterStarted=0;
    for(let j=idx[m.no]+1;j<byTime.length;j++){ if(started(byTime[j])) laterStarted++; }
    // bucket: 0 = active/upcoming (keep in place), 1 = demote to bottom
    // A started match demotes only when >=2 later matches have started
    const demote = s && laterStarted>=2;
    return {m, bucket: demote?1:0, t};
  }).sort((x,y)=> x.bucket!==y.bucket ? x.bucket-y.bucket : x.t-y.t)
    .map(o=>o.m);
}

const RESULT_MAIN_WINDOW_MS=6*60*60*1000;
function resultFinishedAt(m){
  const saved=Number(STATE&&STATE.resultTimes&&STATE.resultTimes[m.no]);
  if(saved>0)return saved;
  const kickoff=new Date(m&&m.iso||'').getTime();
  return Number.isFinite(kickoff)?kickoff+(3*60*60*1000):0;
}
function resultStaysOnMain(m){
  if(Number(m&&m.no)===104)return true;
  const finished=resultFinishedAt(m);
  return finished>0&&Date.now()<finished+RESULT_MAIN_WINDOW_MS;
}

const renderPredictionMatches = renderMatches;
renderMatches = function(){
  if(!STATE) return renderPredictionMatches();
  const originalMatches=STATE.matches;
  const completed=(originalMatches||[])
    .filter(m=>STATE.results&&STATE.results[m.no])
    .sort((a,b)=>(new Date(b.iso||0).getTime()-new Date(a.iso||0).getTime())||Number(b.no)-Number(a.no));

    STATE.matches=completed;

let TOUCHED=new Set(); // match numbers actually edited on THIS device this session
let SAVE_AGAIN=false; // user changed something while a save request was still in flight

function hasCompleteScore(p){return !!p&&p.hg!==''&&p.hg!=null&&p.ag!==''&&p.ag!=null&&Number.isFinite(Number(p.hg))&&Number.isFinite(Number(p.ag));}
function isKODrawMissingWinner(no,p){return Number(no)>=73&&hasCompleteScore(p)&&Number(p.hg)===Number(p.ag)&&p.w!=='H'&&p.w!=='A';}
function pickForSend(no,p){
  if(!hasCompleteScore(p))return null;
  const out={hg:p.hg,ag:p.ag};
  if(Number(no)>=73&&Number(p.hg)===Number(p.ag)){
    out.pen=true;
    if(p.w==='H'||p.w==='A')out.w=p.w;
  }
  return out;
}
function pickComparable(p){
  if(!p)return null;
  const out={hg:String(p.hg??''),ag:String(p.ag??'')};
  if(p.pen)out.pen=true;
  if(p.w==='H'||p.w==='A')out.w=p.w;
  return out;
}
function samePick(a,b){return JSON.stringify(pickComparable(a))===JSON.stringify(pickComparable(b));}
function cloneObj(o){try{return JSON.parse(JSON.stringify(o||{}));}catch(e){return {};}}
function invalidKODrawMessage(list){

function scheduleSave(el){

function touchedPayload(){
  const p={};
  TOUCHED.forEach(no=>{
    const out=pickForSend(no,PREDS[no]||PREDS[String(no)]);
    // Do not send partial scores. This protects saved picks from being erased
    // when autosave fires between typing home and away score.
    if(out)p[no]=out;

}
function findInvalidKODraws(payload){return Object.keys(payload||{}).filter(no=>isKODrawMissingWinner(no,payload[no]));}

// Send ONLY the picks edited on this device — the server treats absent keys as
// "unchanged". Sending the whole PREDS object (old behavior) let a device with
// stale data (old cache, second phone, iOS PWA vs Safari) silently revert
// picks the player had saved elsewhere.
async function savePreds(manual){
  if(!SESSION){if(manual)toast(tr('loginFirst'),true);return;}

  // Prevent overlapping saves. Without this, an older save can return after a
  // newer edit and falsely change the badge to "Saved" while the newer edit is
  // still not saved.
  if(SAVING){SAVE_AGAIN=true;return;}

  syncDomToPreds();
  const payload=touchedPayload();
  const invalid=findInvalidKODraws(payload);
  if(invalid.length){
    DIRTY=true;SAVING=false;updateSaveStatus();refreshKoWarns();
    if(manual)toast(invalidKODrawMessage(invalid),true);
    return;
  }
  const keys=Object.keys(payload);
  if(!keys.length){
    SAVING=false;
    DIRTY=TOUCHED.size>0;
    updateSaveStatus();
    if(manual)toast(DIRTY?incompleteScoreMessage():'OK',!!DIRTY);
    return;
  }

  const sentPayload=cloneObj(payload);
  const sentNos=Object.keys(sentPayload);
  SAVING=true;updateSaveStatus();
  let r=await call('savePreds',SESSION.id,SESSION.pin,payload);
  const localAfterRequest=cloneObj(PREDS);
  SAVING=false;

  if(!r.ok){DIRTY=true;toast(r.msg,true);updateSaveStatus();return;}

  const rejectedSet=new Set((r.rejected||[]).map(String));
  const invalidSet=new Set((r.invalidKODraws||[]).map(String));

  // Start from the server-confirmed truth, then restore only genuinely unsaved
  // local edits that happened while the request was in flight.
  if(r.preds)PREDS=r.preds;
  TOUCHED.forEach(no=>{
    const changedDuringSave=sentPayload[no]?!samePick(localAfterRequest[no],sentPayload[no]):true;
    if(invalidSet.has(String(no))||changedDuringSave){
      if(localAfterRequest[no])PREDS[no]=localAfterRequest[no];
    }
  });

  sentNos.forEach(no=>{
    const changedDuringSave=!samePick(localAfterRequest[no],sentPayload[no]);
    if(invalidSet.has(String(no)))return;        // still needs qualifier
    if(rejectedSet.has(String(no))){TOUCHED.delete(String(no));return;} // locked: discard local edit
    if(!changedDuringSave)TOUCHED.delete(String(no));
  });

  STATE.myPreds=PREDS;
  saveStateCache();

  if(r.cancelledBets&&r.cancelledBets.length){
    r.cancelledBets.forEach(cb=>{delete BETS_STATE.myBets[cb.matchNo];delete BETS_STATE.myBets[String(cb.matchNo)];});
    if(STATE)STATE.myBets=BETS_STATE.myBets;
    PRED_BETTING_LOADED=false;
    const names=r.cancelledBets.map(cb=>'#'+cb.matchNo).join(', ');
    toast((LANG==='ar'?'تم إلغاء رهانك على المباراة لأنك غيّرت توقعك: ':'Your bet was cancelled because you changed your prediction: ')+names,true);
    if(ACTIVE==='pred')loadPredCardBetting(true);else if(ACTIVE==='betting')loadBetting();
  }
  if(invalidSet.size){toast(invalidKODrawMessage(Array.from(invalidSet)),true);}
  else if(rejectedSet.size){toast((LANG==='ar'?'مقفلة: ':'Locked: ')+Array.from(rejectedSet).join(', '),true);}
  else if(manual&&!(r.cancelledBets&&r.cancelledBets.length))toast('OK');

  DIRTY=TOUCHED.size>0;
  updateSaveStatus();
  renderStats();
  if(rejectedSet.size&&!invalidSet.size&&ACTIVE==='pred')renderMatches();

  if(SAVE_AGAIN){
    SAVE_AGAIN=false;
    if(DIRTY){clearTimeout(SAVE_TIMER);SAVE_TIMER=setTimeout(()=>savePreds(false),350);}
  }
}

let BRACKET_ZOOM=1;
function setBracketZoom(z){
  BRACKET_ZOOM=Math.max(0.1,Math.min(4,z));
  const tree=document.querySelector('.bracketTree');
  const wrap=document.querySelector('.bracketZoomWrap');
  if(!tree||!wrap)return;
  // Reset to measure natural (unscaled) dimensions
  tree.style.transition='none';
  tree.style.transform='scale(1)';
  void tree.offsetWidth; // force reflow
  const nw=tree.scrollWidth, nh=tree.scrollHeight;
  const sw=Math.ceil(nw*BRACKET_ZOOM), sh=Math.ceil(nh*BRACKET_ZOOM);
  // Set wrapper to scaled dimensions so scroll container knows the real scrollable area
  wrap.style.width=sw+'px';
  wrap.style.height=sh+'px';
  wrap.style.overflow='hidden';
  tree.style.transition='transform .15s';
  tree.style.transform=`scale(${BRACKET_ZOOM})`;
  const lbl=$('bracketZoomLbl');
  if(lbl)lbl.textContent=Math.round(BRACKET_ZOOM*100)+'%';
}
function fitBracket(){

function scrollToActiveRound(){

  const rounds=[[73,88],[89,96],[97,100],[101,102],[104,104]];

function initBracketPinch(){
  const scroll=document.querySelector('.bracketScroll');
  if(!scroll||scroll._pinchInit)return;
  scroll._pinchInit=true;
  let startDist=0,startZoom=1;

  // ── Touch pinch-zoom (mobile / tablet) ──
  scroll.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      startZoom=BRACKET_ZOOM;
      e.preventDefault();
    }
  },{passive:false});
  scroll.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      setBracketZoom(startZoom*(d/startDist));
      e.preventDefault();
    }
  },{passive:false});

  // ── Mouse wheel zoom (desktop) ──
  scroll.addEventListener('wheel',e=>{
    if(!e.ctrlKey&&!e.metaKey&&Math.abs(e.deltaY)<50&&Math.abs(e.deltaX)>0)return; // allow horizontal trackpad scroll
    e.preventDefault();
    const delta=e.ctrlKey||e.metaKey?e.deltaY:e.deltaY*0.5;
    const factor=1-delta*0.001;
    // Zoom toward the cursor position
    const rect=scroll.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    const oldZoom=BRACKET_ZOOM;
    const newZoom=Math.max(0.2,Math.min(3,oldZoom*factor));
    const ratio=newZoom/oldZoom;
    setBracketZoom(newZoom);
    // Shift scroll so the point under cursor stays fixed
    requestAnimationFrame(()=>{
      scroll.scrollLeft=(scroll.scrollLeft+cx)*ratio-cx;
      scroll.scrollTop=(scroll.scrollTop+cy)*ratio-cy;
    });
  },{passive:false});

  // ── Mouse drag to pan (desktop) ──
  let dragging=false,dragStartX=0,dragStartY=0,dragScrollX=0,dragScrollY=0;
  scroll.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    dragging=true;
    dragStartX=e.clientX; dragStartY=e.clientY;
    dragScrollX=scroll.scrollLeft; dragScrollY=scroll.scrollTop;
    scroll.style.cursor='grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    scroll.scrollLeft=dragScrollX-(e.clientX-dragStartX);
    scroll.scrollTop=dragScrollY-(e.clientY-dragStartY);
  });
  window.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    scroll.style.cursor='grab';
  });
  scroll.style.cursor='grab';
}

// Mirrors the server's _predictedWinner(): derives H/A from the player's own
// saved prediction for a match, so betting UI can lock onto the same team
// the server will enforce in placeBet.
// Points can now be decimal (exact parimutuel bet payouts, e.g. 35.71
// instead of being floored to 35). Show whole numbers clean, decimals to
// 2 places, and guard against stray floating-point artifacts either way.
function fmtPts(n){
  n = Math.round((Number(n)||0) * 100) / 100;
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}
function myPredWinner(matchNo){
  const p=(STATE&&STATE.myPreds&&(STATE.myPreds[matchNo]||STATE.myPreds[String(matchNo)]))||null;
  if(!p)return '';
  const hg=Number(p.hg), ag=Number(p.ag);
  if(!Number.isFinite(hg)||!Number.isFinite(ag))return '';
  if(hg>ag)return 'H';
  if(ag>hg)return 'A';
  return (p.w==='H'||p.w==='A')?p.w:'';
}

function betOddsHtml(pool,mh,ma){const total=pool.total||0,bettors=pool.bettors||0,hPct=total?Math.round(pool.h/total*100):50,aPct=100-hPct,hOdds=pool.h>0?(total/pool.h).toFixed(2):'—',aOdds=pool.a>0?(total/pool.a).toFixed(2):'—';return `<div class="tiny" style="margin:4px 0">🎲 <b>${bettors}</b> ${LANG==='ar'?'لاعب رهن':'players bet'} &nbsp;·&nbsp; ${tr('pool')}: <b>${total}</b> pts</div><div class="tiny" style="margin:2px 0">${esc(mh)} <b>${hOdds}x</b> &nbsp;·&nbsp; ${esc(ma)} <b>${aOdds}x</b></div><div class="betOddsBar"><div class="betOddsH" style="width:${hPct}%"></div><div class="betOddsA" style="width:${aPct}%"></div></div><div class="row tiny" style="justify-content:space-between;margin-top:2px"><span>${esc(mh)} ${hPct}%</span><span>${aPct}% ${esc(ma)}</span></div>`}
// Pools are the only thing worth fetching here: they're identical for everyone
// and served from a shared server cache with no computation. Personal bets and
// balance already arrive with getState/login (STATE.myBets/myBalance) and are
// updated locally by doPlaceBet/doCancelBet — so betting views never trigger
// the expensive per-player balance recompute on the server.
function applyBettingPayload(r){BETS_STATE.pools=r.pools||{};if(r.myBets)BETS_STATE.myBets=r.myBets;if(r.balance!=null)BETS_STATE.balance=r.balance;}
// Mirrors the server's aggregate-exposure cap in placeBet (Code.gs) so the
// displayed "max" hint never disagrees with what the server will actually
// accept. Net balance already has every open stake subtracted, so adding
// them back recovers the same "gross balance" the server checks against;
// the remaining room is then 50% of that gross balance minus what's already
// staked elsewhere. This is a display hint only — the server is still the
// sole source of truth and re-validates on every placeBet call.
function myBetMaxAllowed(isFinal){
  const net=BETS_STATE.balance||0;
  if(isFinal)return Math.floor(net);
  let openStakes=0;
  Object.values(BETS_STATE.myBets||{}).forEach(b=>{if(b&&!b.settled)openStakes+=Number(b.amount||0);});
  const grossBalance=net+openStakes;
  const aggCap=Math.floor(grossBalance*0.5);
  return Math.max(0,aggCap-openStakes);
}

  else box.innerHTML=`<div class="spinner">${LANG==='ar'?'جاري التحميل…':'Loading…'}</div>`;
  const r=await call('getBettingState',0,'');

  tabCacheSet(ck,r);

  if(ae&&ae.closest&&ae.closest('#bettingBox'))return; // don't wipe an in-progress bet entry
  renderBetting();
}
// Collapsible, per-match list of who bet what and their net result — only
// populated by the server once that match has a final result (see
// getBettingState). Native <details>/<summary>: collapsed by default, zero
// added JS state, scrolls internally instead of stretching the page on a
// long bettor list — safe for mobile.
function betSettleListHtml(pool,mh,ma){
  if(!pool||!pool.list||!pool.list.length) return '';
  const rows=pool.list.map(b=>{
    const teamName=b.team==='H'?mh:ma;

    return `<div class="row" style="justify-content:space-between;padding:3px 0"><span class="tiny">${esc(b.name)} · ${esc(teamName)} (${b.amount})</span><span class="betTag ${tag}">${label}</span></div>`;
  }).join('');

let BETTING_SHOW_COMPLETED=false;

const renderAllBettingMatches = renderBetting;
renderBetting = function(){
  if(!STATE){ return renderAllBettingMatches(); }
  const originalMatches = STATE.matches;
  const completed=(originalMatches||[])
    .filter(m=>Number(m.no)>=89&&STATE.results&&STATE.results[m.no])
    .sort((a,b)=>(new Date(b.iso||0).getTime()-new Date(a.iso||0).getTime())||Number(b.no)-Number(a.no));
  const current=(originalMatches||[])
    .filter(m=>Number(m.no)>=89&&(!(STATE.results&&STATE.results[m.no])||resultStaysOnMain(m)))
    .sort((a,b)=>Number(a.no)-Number(b.no));
  STATE.matches=BETTING_SHOW_COMPLETED
    ? completed
    : current;
  try{
    renderAllBettingMatches();
    const box=$('bettingBox');
    if(box){
      const tabs=`<div class="subTabs"><button class="tab ${BETTING_SHOW_COMPLETED?'':'active'}" onclick="setBettingView(false)">${LANG==='ar'?'الحالية':'Current'}</button><button class="tab ${BETTING_SHOW_COMPLETED?'active':''}" onclick="setBettingView(true)">${LANG==='ar'?`المنتهية (${completed.length})`:`Completed (${completed.length})`}</button></div>`;
      box.insertAdjacentHTML('afterbegin',tabs);
    }
  } finally {
    STATE.matches = originalMatches;
  }
};

// If the bet/cancel request looks like it failed, verify against the server
// before trusting that — a slow connection or dropped response right at lock
// time can make the CLIENT give up (30s timeout) even though Apps Script kept
// running and actually completed the write. Re-checking removes the "did my
// bet register?" ambiguity instead of leaving the player guessing seconds
// before the deadline.
async function verifyBetState(matchNo,expectPresent){
  const v=await call('getBettingState',SESSION.id,SESSION.pin);
  if(!v||!v.ok)return null;
  const b=v.myBets&&(v.myBets[matchNo]||v.myBets[String(matchNo)]);
  const matches=expectPresent?!!b:!b;
  if(!matches)return null;
  BETS_STATE.myBets=v.myBets||{}; BETS_STATE.balance=v.balance??null;
  if(STATE){STATE.myBets=BETS_STATE.myBets;STATE.myBalance=BETS_STATE.balance;}
  saveStateCache();
  return true;
}
